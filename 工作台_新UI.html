function weeklyIssue(name){const k='wb_wk_'+name;let v=LS.getItem(k);return (v===null||v==='')?'1':v;}
function weeklyScope(name){
  if(name==='茂业小区')return function(o){return o.grid==='茂业豪园';};
  if(name==='小区')return function(o){return gList(o).some(function(g){return ['沁园新村邵巷','沁园新村范巷','水仙里'].indexOf(g)>=0;});};
  if(name==='茂业商场')return function(o){return o.grid==='经济条线'&&/茂业/.test((o.content||'')+(o.addr||''));};
  return function(){return false;};
}
function inWeek(o,s,e){const d=(o.create||'').slice(0,10);return d>=s&&d<=e;}
function weeklyOrders(name,s,e){
  const A=ORDERS.map(merge).filter(function(o){return !isD(o)&&!isBad(o);});
  const sc=weeklyScope(name);
  return A.filter(function(o){return sc(o)&&inWeek(o,s,e);})
          .sort(function(a,b){return String(a.create).localeCompare(String(b.create));});
}
function fmtCN(d){const p=String(d).split('-');return parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日';}
/* ===== 周报导出：直接生成真正的 .docx（浏览器内打包，零依赖） =====
   为什么不再用「HTML 伪装 .doc」：Word/WPS 会静默丢弃空的 <p></p>，导致"空行"
   全部消失；塞 &nbsp; 能保住空行但会显示成一个小圆圈标记。真 .docx 里的空段落
   是货真价实的 ¶，且段前/行距/字体/字号/颜色/页边距都能按样本原值精确写入。      */
const WF_CN='方正楷体_GBK',WF_HT='方正黑体_GBK',WF_ST='宋体',WF_FS='方正仿宋_GBK';
var _crcT=null;
function crc32b(u8){
  if(!_crcT){_crcT=new Uint32Array(256);
    for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++){c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);}_crcT[n]=c>>>0;}}
  var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++){c=_crcT[(c^u8[i])&0xFF]^(c>>>8);}
  return (c^0xFFFFFFFF)>>>0;
}
/* store-only（不压缩）ZIP 打包：files=[{name,data(Uint8Array|string)}] */
function zipStore(files){
  var enc=new TextEncoder(),chunks=[],cen=[],off=0;
  function u16(a,v){a.push(v&255,(v>>>8)&255);}
  function u32(a,v){a.push(v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255);}
  files.forEach(function(f){
    var nb=enc.encode(f.name),data=(f.data instanceof Uint8Array)?f.data:enc.encode(f.data);
    var crc=crc32b(data),lh=[];
    u32(lh,0x04034b50);u16(lh,20);u16(lh,0);u16(lh,0);u16(lh,0);u16(lh,0);
    u32(lh,crc);u32(lh,data.length);u32(lh,data.length);u16(lh,nb.length);u16(lh,0);
    chunks.push(new Uint8Array(lh),nb,data);
    var ch=[];
    u32(ch,0x02014b50);u16(ch,20);u16(ch,20);u16(ch,0);u16(ch,0);u16(ch,0);u16(ch,0);
    u32(ch,crc);u32(ch,data.length);u32(ch,data.length);
    u16(ch,nb.length);u16(ch,0);u16(ch,0);u16(ch,0);u16(ch,0);u32(ch,0);u32(ch,off);
    cen.push(new Uint8Array(ch),nb);
    off+=lh.length+nb.length+data.length;
  });
  var cenLen=0;cen.forEach(function(c){cenLen+=c.length;});
  var end=[];u32(end,0x06054b50);u16(end,0);u16(end,0);
  u16(end,files.length);u16(end,files.length);u32(end,cenLen);u32(end,off);u16(end,0);
  var all=chunks.concat(cen,[new Uint8Array(end)]),total=0;
  all.forEach(function(c){total+=c.length;});
  var out=new Uint8Array(total),p=0;
  all.forEach(function(c){out.set(c,p);p+=c.length;});
  return out;
}
function xesc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function wFont(f){return '<w:rFonts w:hint="eastAsia" w:ascii="'+f+'" w:hAnsi="'+f+'" w:eastAsia="'+f+'" w:cs="'+f+'"/>';}
function wRun(text,font,sz,o){
  o=o||{};
  var rp='<w:rPr>'+wFont(font);
  if(o.b)rp+='<w:b/><w:bCs/>';
  if(o.color)rp+='<w:color w:val="'+o.color+'"/>';
  rp+='<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>';
  if(o.u)rp+='<w:u w:val="single" w:color="'+o.u+'"/>';
  rp+='</w:rPr>';
  var body=o.tab?'<w:tab/>':'';
  if(text!==undefined&&text!==null&&text!=='')
    body+='<w:t xml:space="preserve">'+String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').map(xesc).join('<w:br/>')+'</w:t>';
  return '<w:r>'+rp+body+'</w:r>';
}
function wSp(before,line){return '<w:spacing w:before="'+before+'" w:after="0" w:line="'+line+'" w:lineRule="auto"/>';}
function wPara(ppr,runs){return '<w:p><w:pPr>'+ppr+'</w:pPr>'+runs+'</w:p>';}
function wBlank(line){return '<w:p><w:pPr>'+wSp(0,line)+'</w:pPr></w:p>';}
/* line=360 → 1.5 倍行距（twips 以 240 为单倍）；sz=30→15pt 小三，sz=35→17.5pt，sz=71→35.5pt */
function weeklyDocXml(name,issue,s,e,os){
  var rangeCN=fmtCN(s)+'-'+fmtCN(e),N=os.length,P=[];
  var BODY=wSp(0,360)+'<w:ind w:firstLineChars="200" w:firstLine="600"/><w:jc w:val="both"/>';
  /* 标题：宋体 35.5pt 加粗 标红 居中 单倍行距 */
  P.push(wPara(wSp(219,240)+'<w:jc w:val="center"/>',wRun(name+'每周动态',WF_ST,71,{b:1,color:'FF0000'})));
  /* 期号：方正楷体_GBK 15pt 黑 居中 单倍行距 */
  P.push(wPara(wSp(200,240)+'<w:jc w:val="center"/>',wRun('第 '+issue+' 期',WF_CN,30)));
  /* 落款：方正楷体_GBK 15pt 黑；tab+文字整段带红色下划线 = 那条红线 */
  P.push(wPara('<w:tabs><w:tab w:val="left" w:pos="4923"/></w:tabs>'+wSp(200,240)+'<w:ind w:left="414"/>',
    wRun('',WF_CN,30,{tab:1,u:'FF0000'})+wRun('扬名街道清二社区综治办',WF_CN,30,{u:'FF0000'})));
  /* 导语前：空一行（真·空段落，只有 ¶） */
  P.push(wBlank(360));
  /* 导语：方正仿宋_GBK 15pt 黑 首行缩进 2 字符 两端对齐 */
  P.push(wPara(BODY,wRun(rangeCN+'，社区综治办共收到关于'+name+'物业管理类 12345 投诉（求助）工单 '+N+' 张，具体情况如下：',WF_FS,30)));
  /* 一、前：空一行 */
  P.push(wBlank(360));
  P.push(wPara(wSp(0,360),wRun('一、"12345"工单情况',WF_HT,35,{color:'FF0000'})));
  if(!N)P.push(wPara(BODY,wRun('（本周无工单）',WF_FS,30)));
  else os.forEach(function(o,i){P.push(wPara(BODY,wRun((i+1)+'、'+(o.content||''),WF_FS,30)));});
  /* 二、前：空一行 */
  P.push(wBlank(360));
  P.push(wPara(wSp(0,360),wRun('二、居民来访情况',WF_HT,35,{color:'FF0000'})));
  P.push(wPara(BODY,wRun('无',WF_FS,30)));
  var sect='<w:sectPr><w:pgSz w:w="11906" w:h="16839"/>'+
    '<w:pgMar w:top="1431" w:right="1785" w:bottom="0" w:left="1785" w:header="0" w:footer="0" w:gutter="0"/>'+
    '<w:cols w:space="720" w:num="1"/></w:sectPr>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+
    P.join('')+sect+'</w:body></w:document>';
}

function docxFiles(name,issue,s,e,os){
  return [
    {name:'[Content_Types].xml',data:DOCX_CT},
    {name:'_rels/.rels',data:DOCX_RELS},
    {name:'word/_rels/document.xml.rels',data:DOCX_DRELS},
    {name:'word/document.xml',data:weeklyDocXml(name,issue,s,e,os)},
    {name:'word/styles.xml',data:DOCX_STYLES}

function downloadDocx(fn,bytes){
  const b=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},1000);
}

function dlWeekly(){
  const nm=document.getElementById('wkName');if(!nm)return;
  const name=nm.value, s=document.getElementById('wkS').value, e=document.getElementById('wkE').value;
  LS.setItem('wb_wk_'+name,document.getElementById('wkNo').value);
  const os=weeklyOrders(name,s,e);
  const bin=zipStore(docxFiles(name,document.getElementById('wkNo').value,s,e,os));
  const fn=name+'每周动态_'+s.slice(5).replace('-','.')+'-'+e.slice(5).replace('-','.')+'.docx';
  downloadDocx(fn,bin);
}
function pgWeekly(){
  const today=new Date(), dow=today.getDay();
  const mon=new Date(today);mon.setDate(today.getDate()-(dow===0?6:dow-1));
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const f=function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);};
  const ds=f(mon), de=f(fri);
  let h='<h3 style="margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid #007AFF">周报（网格动态）</h3>'+
     '<div class="tip">系统按「工单号」去重，重复丢同一 Word 不会多算；Excel 台账按编号合并，亦不重复。'+
     '周报只列本周新收工单（不含已退回），按创建时间计入本周。</div>';
  h+='<div class="card"><div class="bar">'+
     '报告：<select id="wkName" onchange="document.getElementById(\'wkNo\').value=weeklyIssue(this.value)">'+
       '<option>茂业商场</option><option>茂业小区</option><option>小区</option></select>　'+
     '起：<input id="wkS" type="date" value="'+ds+'">　止：<input id="wkE" type="date" value="'+de+'">　'+
     '期号：第<input id="wkNo" type="number" style="width:64px" value="'+weeklyIssue('茂业商场')+'">期　'+
     '<button class="btn green" onclick="genWeekly()">生成预览</button>'+
     '<button class="btn" onclick="dlWeekly()">下载 Word</button></div>'+
     '<div class="mini" style="margin-top:6px">「期号」自动记住上次数值（按报告分别记）。'+
     '「起/止」默认本周一到周五，可手改应对调休等特殊情况。</div></div>';
  h+='<div class="card" id="wkPrev"><div class="mini">点「生成预览」看本周内容。</div></div>';
  return h;
}

function cStack(labels,keys,mat,opt){opt=opt||{};

function pgDash(){
  const RO=(ROLE==='领导');
  const A=pool();
  const mth=BASE.slice(0,7), pm=monAdd(mth,-1), mm=A.filter(o=>o.month===mth), pmm=A.filter(o=>o.month===pm);
  const A0=ORDERS.map(merge).filter(o=>o.src==='Word'&&!isD(o)&&!isBad(o));
  const wkNew=A0.filter(inWk), act=A.filter(active), done=A.filter(o=>o.status==='已办结');
  const w=wkRange();
  let h=pHead('工作台','本周 '+w[0].slice(5).replace('-','/')+' – '+w[1].slice(5).replace('-','/')+' · 基准日 '+BASE,
    '<button class="btn gray sm" onclick="openScope()">'+ico('info')+'统计口径</button>');
  if(RO)h+='<div class="tip">领导视图为只读，可查看全部分析页。</div>';
  const diff=mm.length-pmm.length;
  h+='<div class="kgrid">'+
    kT('本周新收',wkNew.length,'#007AFF','inbox','Word 工单 · 周一至今',drill('本周新收',nosOf(wkNew)))+
    kT('本月工单',mm.length,'#34C759','cal',(+mth.slice(5))+'月 · 上月 '+pmm.length+' 件'+
       (pmm.length||mm.length?'<b class="'+(diff>0?'red':'grn')+'"> '+(diff>0?'▲':diff<0?'▼':'')+Math.abs(diff)+'</b>':''),drill('本月工单',nosOf(mm)))+
    kT('在办工单',act.length,'#FF9500','clock','处理中 + 待分派',drill('在办工单',nosOf(act)))+
    kT('有效样本',A.length,'#5856D6','stack','办结率 '+(A.length?(done.length/A.length*100).toFixed(0):0)+'%',drill('有效样本',nosOf(A)))+
    '</div>';

  /* 分派核对 */
  const ns=checkOrders();
  const unk=ns.filter(o=>o.grid==='未识别').length;
  const pc=pendCount();
  const dn=ns.filter(o=>ck(o.no)).length, todo=ns.length-dn;
  let t='<div class="card">'+cardH('新收工单 · 分派核对','inbox','#007AFF',ns.length+' 件','列出本周（周一至今）新收的 Word 工单；本周不足 5 条时显示最近 5 条，未识别网格的排在最前。<br>核对系统自动分派的网格与承办人：改网格会自动带出默认承办人，承办人可多选。改完需点「确认改派」才生效；没问题就点右侧圆圈标记已核对。');
  if(!ns.length)t+='<div class="empty">'+ico('check')+'<div>本周暂无新收工单</div></div>';
  else{
    t+='<div class="tbl-wrap"><table class="tbl"><tr><th>日期</th><th>工单 / 诉求</th><th>网格</th><th>承办人</th><th></th></tr>';
    ns.forEach(o=>{const isU=o.grid==='未识别', isC=ck(o.no);
      const tags=(isU?'<span class="pill red">未识别</span>':'')+(PEND[o.no]?'<span class="pill blue">待确认</span>':'')+(isC?'<span class="pill green">已核对</span>':'');
      t+='<tr class="'+(isU?'r-unk':(isC?'r-ok':''))+'" onclick="detOne(\''+esc(o.no)+'\')">'+
         '<td class="c-date">'+esc((o.create||'').slice(5,10).replace('-','/'))+'</td>'+
         '<td class="c-main"><div class="c-no">'+esc(o.no)+tags+'</div><div class="c-sum" title="'+esc(o.content||'')+'">'+esc(sumOf(o,46))+'</div></td>'+
         '<td onclick="event.stopPropagation()">'+gridSel(o.no,o.grid)+'</td>'+
         '<td onclick="event.stopPropagation()">'+personSel(o.no,o.person)+'</td>'+
         '<td onclick="event.stopPropagation()" class="c-act"><button class="ckb'+(isC?' on':'')+'" title="'+(isC?'取消核对':'标记已核对')+'" onclick="toggleCk(\''+esc(o.no)+'\')">'+ico('check')+'</button></td></tr>';});
    t+='</table></div>';
  }
  t+='</div>';

  /* 右侧：核对进度 */
  const p=ns.length?dn/ns.length:1;
  let r='<div class="card side">'+cardH('核对进度','check','#34C759','','改派和核对结果保存在当前电脑的浏览器里。<br>点「导出改派.json」，放入 _系统/ 后重跑「一键更新」，即可固化到数据中、跨机器生效，并进入重复焦点分组。')+
    '<div class="prog">'+ring(p,todo?'#34C759':'#34C759')+'<div class="prog-l">'+
    '<div><span class="dot" style="background:#34C759"></span>已核对<b>'+dn+'</b></div>'+
    '<div><span class="dot" style="background:#FF9500"></span>待核对<b>'+todo+'</b></div>'+
    '<div><span class="dot" style="background:#FF3B30"></span>未识别<b>'+unk+'</b></div></div></div>';

     '<button class="btn gray sm" onclick="resetReassign()">重置</button></div></div>';
  r+='<button class="btn gray sm wide" onclick="exportReassign()">导出改派.json</button>';
  const dgB=ORDERS.map(merge).filter(o=>!isD(o)&&(o.back||o.status==='已退回'));
  if(dgB.length)r+='<div class="side-ft">退回件（非本辖区）<b>'+dgB.length+'</b> 件，已剔除<button class="lnk" onclick="'+drill('退回件（非本辖区）',dgB.map(o=>o.no))+'">查看</button></div>';
  r+='</div>';
  h+='<div class="g-main">'+t+r+'</div>';

  /* 网格分布 */
  const gc={},dmG={},xNos=[];
  A.forEach(o=>{if(o.cross){xNos.push(o.no);return;}
    const g=o.grid||'未识别';gc[g]=(gc[g]||0)+1;(dmG[g]=dmG[g]||[]).push(o.no);});
  const gitems=Object.keys(gc).map(k=>({k:k,v:gc[k]})).sort((a,b)=>b.v-a.v);
  if(xNos.length){gitems.push({k:'跨网格协同',v:xNos.length});dmG['跨网格协同']=xNos;}
  const mem=A.reduce((a,o)=>a+gList(o).length,0);
  const gc2={},dmG2={},x2=[];
  mm.forEach(o=>{if(o.cross){x2.push(o.no);return;}
    const g=o.grid||'未识别';gc2[g]=(gc2[g]||0)+1;(dmG2[g]=dmG2[g]||[]).push(o.no);});
  const gi2=Object.keys(gc2).map(k=>({k:k,v:gc2[k]})).sort((a,b)=>b.v-a.v);
  if(x2.length){gi2.push({k:'跨网格协同',v:x2.length});dmG2['跨网格协同']=x2;}
  h+='<div class="g2">'+
     '<div class="card">'+cardH('网格分布 · 全部','grid','#5856D6','','有效样本已剔除退回件与演练件。<br>跨网格协同 '+xNos.length+' 件同时涉及两个网格，本图只计一次；按网格展开则为 '+mem+' 件次。<br>点扇区或图例查看该网格工单。')+cDonut(gitems,{dm:dmG})+'</div>'+
     '<div class="card">'+cardH('网格分布 · '+(+mth.slice(5))+'月','grid','#34C759','','基准日所在月份的网格分布，与左图对比可看出各网格本月占比的变化。')+
     (gi2.length?cDonut(gi2,{dm:dmG2}):'<div class="empty">'+ico('cal')+'<div>'+(+mth.slice(5))+'月暂无工单</div></div>')+'</div></div>';

  h+='<section id="sW">'+pgWeekly()+'</section>';
  return h;
}

  const G='<div class="card">'+cardH('网格分布','grid','#5856D6',ms.length===1?ms[0]:'','随上方时间、网格筛选变化。跨网格协同件单列一类，不重复计入两个网格。点扇区或图例查看该网格工单。')+cDonut(gi,{dm:dg})+'</div>';

/* ---------------- ③ 重复与焦点 ---------------- */
function pgFocus(){

    return (inRange(o.month)&&(!F.fgrid||o.grid===F.fgrid))?o:null;};
  const phKey=o=>{const p=String((o&&o.phone)||'');if(!p||p==='保密')return '';return p.replace(/\D/g,'')||p;};
  const sliceDup=r=>{const ns=(r.工单||[]).map(keep).filter(Boolean);if(ns.length<2)return null;
    const ds=ns.map(o=>String(o.create||'').slice(0,10)).filter(Boolean).sort();

       '<div class="kt-v">'+dup.length+'<small> 组</small></div><div class="kt-s">'+(hasF?'全期 '+dupAll.length+' 组':'同一事项反复出现')+'</div></div>'+

  const tbl=(title,rows,cols,grp)=>{
    let s='<div class="sub-t">'+title+'<span>'+rows.length+'</span></div>';
    if(!rows.length)return s+'<div class="mini">无</div>';
    s+='<div class="tbl-wrap"><table class="tbl"><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>';

  const QB=[['all','全部','',''],['this','本月',b,b],['r3','近3月',monAdd(b,-2),b],['q','本季度',qs,monAdd(qs,2)],
            ['h1','上半年',y+'-01',y+'-06'],['h2','下半年',y+'-07',y+'-12'],['year','全年',y+'-01',y+'-12']];
  let s='<div class="filters"><div class="seg">'+QB.map(q=>'<button class="'+(F.m0===q[2]&&F.m1===q[3]?'on':'')+

/* ---------------- 明细清单 ---------------- */
function detList(nos,mode,grp){
  if(!nos||!nos.length)return '<div class="empty">'+ico('inbox')+'<div>没有工单</div></div>';
  const M=(mode==='done'||mode==='sent'),D=(mode==='due');
  let L=nos.slice();
  if(M)L.sort((a,b)=>{const oa=no2o(a),ob=no2o(b);return String(rt(ob.no,ob.replyTime||'')).localeCompare(String(rt(oa.no,oa.replyTime||'')));});
  else if(D)L.sort((a,b)=>(no2o(a).deadline||'').localeCompare(no2o(b).deadline||''));
  else L.sort((a,b)=>String(no2o(b).create||'').localeCompare(String(no2o(a).create||'')));
  const rowOf=n=>{const o=no2o(n);
    let ext='';
    if(D){const b=band(o.deadline);ext='<span style="color:'+b.c+'">'+esc(b.t)+'</span>';}
    if(M){const r=rp(o.no,o.reply||'');ext=r?'回复：'+esc(cut(r,50)):'<span class="gry">无回复内容</span>';}
    return '<div class="lrow" onclick="detOne(\''+esc(o.no)+'\',1)">'+
      '<div class="l-date">'+esc((o.create||'').slice(0,10))+'</div>'+
      '<div class="l-body"><div class="l-sum">'+esc(sumOf(o,70))+'</div>'+
      '<div class="l-meta"><span class="mono">'+esc(o.no)+'</span><span>'+esc(o.gridLabel||o.grid||'-')+'</span>'+
      '<span>'+esc(String(o.person||'-').replace(/\+/g,'、'))+'</span>'+(ext?'<span>'+ext+'</span>':'')+'</div></div>'+
      '<div class="l-st">'+stPill(o.status)+(isD(o)?'<span class="pill purple">演练</span>':'')+'</div><span class="l-go">›</span></div>';};
  if(grp&&Object.keys((DATA.semantic||{}).工单主题||{}).length){
    const bk={},order=[];
    L.forEach(n=>{const t=tpOf(n)||'其他事项';if(!bk[t]){bk[t]=[];order.push(t);}bk[t].push(n);});
    return '<div class="tpleg">涉及 <b>'+order.length+'</b> 类：'+order.map(t=>'<span><i style="background:'+tpColor(t)+'"></i>'+esc(t)+' '+bk[t].length+'</span>').join('')+'</div>'+
      order.map(t=>'<div class="lgrp"><div class="lgrp-h"><i style="background:'+tpColor(t)+'"></i>'+esc(t)+'<span>'+bk[t].length+' 件</span></div>'+bk[t].map(rowOf).join('')+'</div>').join('');
  }
  return '<div class="lgrp">'+L.map(rowOf).join('')+'</div>';}

      '统计时单列为「跨网格协同」，不在两个网格里重复计数。'+(s.cross?'因此各网格合计 = <b>'+s.val+'</b> 件；若按网格分别计入，则为 '+s.mem+' 件次。':''))+
    rule('按创建时间归月','月度统计以工单的创建时间为准，与办结时间无关。')+
    rule('有效样本构成','已办结 <b>'+s.done+'</b> 件，在办（处理中 + 待分派）<b>'+s.act+'</b> 件。')+
    '</div>';
  return f+r;}

/* ---------------- 导出 PDF ---------------- */
function exportAllPDF(){
  closeDr();
  const M=document.getElementById('main'),saveHTML=M.innerHTML,savePAGE=PAGE;
  const pages=(ROLE==='领导'?NAV.L:NAV.A).map(x=>x[0]);
  window._prtAll=1;
  M.innerHTML=pages.map(function(x){PAGE=x;
    return '<section class="pgsec">'+({dash:pgDash,month:pgMonth,focus:pgFocus}[x])()+'</section>';}).join('');
  PAGE=savePAGE;window._prtAll=0;
  document.body.classList.add('prt-all');
  window.onafterprint=function(){document.body.classList.remove('prt-all');M.innerHTML=saveHTML;render();window.onafterprint=null;};
  window.print();
}
function printPage(){closeDr();render();window.print();}

/* ---------------- 改派确认弹窗 ---------------- */
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}
function openModal(html){closeModal();const d=document.createElement('div');d.id='modal';d.className='modal';
  d.innerHTML='<div class="modal-bg" onclick="closeModal()"></div><div class="modal-box" role="dialog">'+html+'</div>';
  document.body.appendChild(d);}
function openReassign(){
  const ks=Object.keys(PEND);if(!ks.length)return;
  const rows=ks.map(no=>{const o=no2o(no),P=PEND[no];
    const g0=o.grid||'-',g1=(P.grid!==undefined?P.grid:g0);
    const p0=String(o.person||'待定').replace(/\+/g,'、'),p1=String(P.person!==undefined?(P.person||'待定'):o.person||'待定').replace(/\+/g,'、');
    const ch=(a,b)=>a===b?'<span class="mc-same">'+esc(a)+'</span>':'<span class="mc-old">'+esc(a)+'</span><span class="mc-ar">→</span><span class="mc-new">'+esc(b)+'</span>';
    return '<div class="mc-row"><div class="mc-sum">'+esc(sumOf(o,40))+'</div><div class="mc-no mono">'+esc(no)+'</div>'+
      '<div class="mc-kv"><span>网格</span>'+ch(g0,g1)+'</div><div class="mc-kv"><span>承办人</span>'+ch(p0,p1)+'</div></div>';}).join('');
  openModal('<div class="modal-ic">'+ico('edit')+'</div><div class="modal-t">确认改派 '+ks.length+' 条工单？</div>'+
    '<div class="modal-d">确认后立即生效，并自动标记为已核对。</div><div class="mc-list">'+rows+'</div>'+
    '<div class="modal-btns"><button class="btn gray" onclick="askReset()">撤销全部</button><span class="sp"></span>'+
    '<button class="btn gray" onclick="closeModal()">取消</button><button class="btn" onclick="doConfirm()">确认改派</button></div>');}
function askReset(){const n=pendCount();
  openModal('<div class="modal-ic warn">'+ico('back')+'</div><div class="modal-t">撤销全部改派？</div>'+
    '<div class="modal-d">这 '+n+' 条工单的网格和承办人将恢复为系统分派结果，此操作不可撤回。</div>'+
    '<div class="modal-btns"><span class="sp"></span><button class="btn gray" onclick="openReassign()">返回</button>'+
    '<button class="btn danger" onclick="closeModal();resetReassign();toast(\'已撤销 '+n+' 条改派\')">撤销全部</button></div>');}
function doConfirm(){const n=pendCount();closeModal();EDR={};confirmReassign();toast('已确认 '+n+' 条改派');}
function toast(t){const d=document.createElement('div');d.className='toast';d.innerHTML=ico('check')+'<span>'+esc(t)+'</span>';
  document.body.appendChild(d);setTimeout(()=>d.classList.add('out'),1800);setTimeout(()=>d.remove(),2200);}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

if(document.addEventListener)document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeDr();});
initLogin();

if(DATA.demo){enter('A',true);}
else if(saved==='A'||saved==='领导'){enter(saved,false);}
