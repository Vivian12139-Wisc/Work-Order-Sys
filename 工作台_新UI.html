<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>清二社区 · 12345 工单工作台</title>
<style>
:root{
 --bg:#f5f5f7; --bg2:#ececf0; --card:#ffffff; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
 --sep:rgba(60,60,67,.12); --sep2:rgba(60,60,67,.2);
 --t1:#1d1d1f; --t2:#6e6e73; --t3:#8e8e93;
 --blue:#007aff; --blue-bg:rgba(0,122,255,.1); --green:#34c759; --green-d:#248a3d; --orange:#ff9500; --red:#ff3b30; --purple:#af52de;
 --r-lg:16px; --r:12px; --r-sm:8px;
 --sh:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
 --sh-hover:0 2px 4px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.09);
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
 --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;letter-spacing:-.01em}
button{cursor:pointer;font-family:inherit}
::selection{background:rgba(0,122,255,.2)}

/* ───────── 登录 ───────── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
 background:radial-gradient(1200px 700px at 15% 10%,#d9e8ff 0%,transparent 60%),
            radial-gradient(900px 600px at 90% 90%,#f3e1ff 0%,transparent 55%),#f5f5f7}
.lcard{background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
 border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:34px 32px 26px;width:100%;max-width:520px;
 box-shadow:0 20px 60px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06)}
.lcard h1{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--t1)}
.lcard h1::before{content:"";display:block;width:52px;height:52px;border-radius:13px;margin-bottom:16px;
 background:linear-gradient(160deg,#5ac8fa,#007aff 70%);box-shadow:0 6px 16px rgba(0,122,255,.35);
 -webkit-mask:none}
.lmeta{font-size:13px;color:var(--t2);margin-bottom:22px}
.r3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rbig{background:var(--card);border:0;border-radius:var(--r);padding:16px;text-align:left;font-size:15px;font-weight:600;color:var(--t1);
 box-shadow:0 0 0 .5px var(--sep2),0 1px 3px rgba(0,0,0,.05);transition:transform .15s,box-shadow .15s}
.rbig:hover{box-shadow:0 0 0 2px var(--blue),0 6px 18px rgba(0,122,255,.15)}
.rbig:active{transform:scale(.98)}
.rbig .sub{display:block;font-size:12px;font-weight:400;color:var(--t2);margin-top:4px}
.rbig.wide{grid-column:auto}
.small{font-size:13px;color:var(--t2)}
.pwdrow{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pwdrow input{padding:9px 12px;border:0;border-radius:var(--r-sm);width:140px;font-size:16px;letter-spacing:4px;
 background:var(--fill);outline:none;font-family:inherit}
.pwdrow input:focus{box-shadow:0 0 0 3px rgba(0,122,255,.35)}
.demo{margin-top:16px;text-align:center}
.demo button{background:transparent;border:0;color:var(--blue);border-radius:var(--r-sm);padding:10px 18px;width:100%;font-size:14px}
.demo button:hover{background:var(--blue-bg)}
.who{display:none}.who.on{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pbtn{background:#fff;border:0;border-radius:var(--r-sm);padding:10px;text-align:center;position:relative;box-shadow:0 0 0 .5px var(--sep2)}
.pbtn:hover{box-shadow:0 0 0 2px var(--blue)}
.pbtn b{font-size:16px}.pbtn .g{font-size:11px;color:var(--t2);display:block}
.pbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px}
.grp{font-size:12px;color:var(--t2);margin:14px 0 6px;font-weight:600}

/* ───────── 按钮 ───────── */
.btn{background:var(--blue);color:#fff;border:0;border-radius:var(--r-sm);padding:7px 14px;font-size:13px;font-weight:500;
 transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.gray{background:var(--fill);color:var(--t1)}
.btn.gray:hover{background:rgba(118,118,128,.2);filter:none}
.btn.green{background:var(--green)}
.btn.orange{background:var(--orange)}
.abtn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:var(--r-sm);padding:7px 14px;
 font-size:13px;font-weight:500;text-decoration:none;font-family:inherit}
.lnk{display:inline-block;background:none;border:0;color:var(--blue);font-size:12px;padding:2px 6px;border-radius:6px;
 text-decoration:none;font-family:inherit;cursor:pointer}
.lnk:hover{background:var(--blue-bg)}

/* ───────── 顶栏（macOS 工具栏） ───────── */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;
 background:rgba(246,246,248,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
 border-bottom:.5px solid var(--sep2)}
header .brand{font-weight:600;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-right:6px}
header .brand::before{content:"";width:22px;height:22px;border-radius:6px;flex-shrink:0;
 background:linear-gradient(160deg,#5ac8fa,#007aff 70%);box-shadow:0 1px 3px rgba(0,122,255,.4)}
header .mini{color:var(--t2);font-size:12px}
header input[type=date],.hd-right select{padding:5px 8px;border-radius:7px;border:0;font-family:inherit;font-size:13px;
 background:var(--fill);color:var(--t1);outline:none}
header input[type=date]:focus,.hd-right select:focus{box-shadow:0 0 0 3px rgba(0,122,255,.3)}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
#whoTag{color:var(--t2);font-size:12px;margin-right:2px}
.hd-right .btn.gray{background:transparent;color:var(--t1);padding:6px 10px}
.hd-right .btn.gray:hover{background:var(--fill)}
.banner{background:rgba(255,149,0,.12);color:#a05a00;padding:7px 16px;font-size:12px;text-align:center;border-bottom:.5px solid rgba(255,149,0,.25)}

/* ───────── 侧边栏 + 主区 ───────── */
.wrap{display:flex;min-height:calc(100vh - 53px)}
nav{width:200px;flex-shrink:0;padding:16px 10px;background:rgba(236,236,240,.6);border-right:.5px solid var(--sep);
 position:sticky;top:53px;align-self:flex-start;height:calc(100vh - 53px);overflow-y:auto}
nav::before{content:"分析";display:block;font-size:11px;font-weight:600;color:var(--t3);padding:0 10px 6px;letter-spacing:.02em}
nav a,nav .nvb{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;margin-bottom:2px;color:var(--t1);
 text-decoration:none;font-size:13px;font-weight:500;border:0;border-radius:7px;background:none;transition:background .12s}
nav a:hover,nav .nvb:hover{background:rgba(0,0,0,.05)}
nav a.on,nav .nvb.on{background:var(--blue);color:#fff}
nav .ni{width:18px;height:18px;flex-shrink:0;display:inline-flex}
nav .ni svg{width:18px;height:18px}
nav .nvb .ni{color:var(--blue)}
nav .nvb.on .ni{color:#fff}
main{flex:1;min-width:0;padding:28px 32px 60px;overflow-x:auto;max-width:1280px}
h2.pg{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0 0 16px;padding:0;border:0}
h3{letter-spacing:-.015em}

/* ───────── 卡片 / KPI ───────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh)}
.kpi .v{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--t2);margin-top:4px;font-weight:500}
.kpi.click{cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi.click:hover{box-shadow:var(--sh-hover);transform:translateY(-2px)}
.kpi.click .l::after{content:" ›";color:var(--t3)}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.card > b:first-child{font-size:16px;font-weight:600;letter-spacing:-.015em;display:inline-block;margin-bottom:2px}
.grid2c{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;margin-bottom:16px}
.grid2c .card{margin-bottom:0}
.pgrid{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.pcard{flex:1 1 168px;min-width:156px;background:var(--card);border:0;border-radius:var(--r);padding:12px 14px;cursor:pointer;
 box-shadow:0 0 0 .5px var(--sep2);position:relative;overflow:hidden;transition:box-shadow .15s}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.pcard:hover{box-shadow:0 0 0 .5px var(--sep2),var(--sh-hover)}
.pcard b{font-size:15px}.pcard .mini{line-height:1.6}

/* ───────── 表格（macOS 列表） ───────── */
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);font-size:13px}
th{background:transparent;color:var(--t2);font-weight:600;font-size:12px;padding:8px 10px;text-align:left;white-space:nowrap;
 border-bottom:.5px solid var(--sep2)}
td{padding:9px 10px;border-bottom:.5px solid var(--sep);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child,td.mono{white-space:nowrap}
tr:hover td{background:rgba(0,122,255,.04)}
.card table{margin-top:8px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;line-height:1.5}
.tag.drl{background:var(--purple)}
.pcks{display:inline-flex;flex-wrap:wrap;gap:2px 8px;max-width:260px}
.pcks .ck{font-size:12px;white-space:nowrap;cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:var(--blue)}
td select,.card select,.card input[type=date],.card input[type=number],.bar input,.bar select{
 padding:5px 8px;border:0;border-radius:7px;background:var(--fill);font-family:inherit;font-size:13px;color:var(--t1);outline:none}
td select:focus,.card select:focus,.card input:focus{box-shadow:0 0 0 3px rgba(0,122,255,.3)}
.mini{font-size:12px;color:var(--t2)}
.mono{font-family:var(--mono);font-size:12px}

/* ───────── 筛选条（分段控件风格） ───────── */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;background:var(--card);
 border-radius:var(--r);padding:10px 14px;box-shadow:var(--sh)}
.filters > b{font-size:12px;color:var(--t2);font-weight:600}
.filters select,.filters input{padding:5px 8px;border:0;border-radius:7px;background:var(--fill);font-family:inherit;font-size:13px;outline:none}
.qgrp{display:inline-flex;gap:2px;flex-wrap:wrap;align-items:center;background:var(--fill);border-radius:8px;padding:2px}
.qgrp .lnk{color:var(--t1);font-size:12px;font-weight:500;padding:4px 10px;border-radius:6px}
.qgrp .lnk:hover{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.rngnote{background:var(--blue-bg);border:0;padding:9px 14px;font-size:12px;margin-bottom:12px;border-radius:var(--r-sm);color:#0a4a9e}
.rngnote .mini{color:#3a6cad}

/* ───────── 提示条 ───────── */
.tip,.ok,.scope{border:0;border-radius:var(--r);padding:11px 14px 11px 40px;font-size:13px;margin-bottom:14px;position:relative}
.tip{background:rgba(255,149,0,.1);color:#7a4500}
.tip::before,.ok::before,.scope::before{position:absolute;left:14px;top:10px;width:18px;height:18px;border-radius:50%;
 color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.tip::before{content:"!";background:var(--orange)}
.ok{background:rgba(52,199,89,.1);color:#1c5c2c}
.ok::before{content:"✓";background:var(--green)}
.card.scope{background:var(--card);box-shadow:var(--sh);padding:14px 18px 14px 44px}
.scope::before{content:"i";background:var(--blue);font-family:Georgia,serif;font-style:italic;top:14px;left:16px}
.scope > b:first-child{font-size:14px}

.ocard{border:0;border-radius:var(--r);padding:12px 14px;margin-bottom:10px;background:var(--card);box-shadow:0 0 0 .5px var(--sep2)}
.ocard .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ocard .no,.frow .no{font-weight:600;font-family:var(--mono);font-size:12px}
.ocard .body{background:var(--bg);border-radius:var(--r-sm);padding:10px;margin-top:8px;font-size:13px;white-space:pre-wrap}
textarea{width:100%;border:0;border-radius:var(--r-sm);padding:10px;font-family:inherit;font-size:13px;background:var(--fill);outline:none}
textarea:focus{box-shadow:0 0 0 3px rgba(0,122,255,.3)}
.bar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.hide{display:none}
.red{color:var(--red)}.org{color:var(--orange)}.grn{color:var(--green-d)}.gry{color:var(--t2)}
.cbox{margin-top:10px}
details{margin-top:12px}
summary{cursor:pointer;font-size:13px;color:var(--blue);padding:4px 0;list-style:none;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";display:inline-block;margin-right:6px;transition:transform .15s;font-weight:700}
details[open] > summary::before{transform:rotate(90deg)}
svg text{font-family:var(--font)}
svg [data-d]{cursor:pointer;transition:opacity .12s}svg [data-d]:hover{opacity:.7}

/* ───────── 明细抽屉（iOS Sheet 风格） ───────── */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:90;animation:fd .2s}
.drawer{position:fixed;right:12px;top:12px;bottom:12px;width:min(780px,94vw);background:rgba(245,245,247,.94);
 -webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);z-index:91;overflow-y:auto;
 border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.1);padding:0 18px 18px;animation:sl .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.dhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:2;margin:0 -18px 12px;padding:16px 18px 12px;
 background:rgba(245,245,247,.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.dhd b{font-size:17px;font-weight:600;letter-spacing:-.015em}
.dhd .sp{margin-left:auto;display:flex;gap:8px}
.dsec{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 0 0 .5px var(--sep)}
.dsec h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--t2);border:0;padding:0;letter-spacing:.02em}
.drow{display:flex;gap:16px;font-size:13px;color:var(--t2);margin-bottom:6px;flex-wrap:wrap}
.drow b{color:var(--t1);font-weight:600}
.dtxt{background:var(--bg);border-radius:var(--r-sm);padding:11px;font-size:14px;white-space:pre-wrap;line-height:1.7}
.drep{background:rgba(52,199,89,.08);border:0;border-radius:var(--r-sm);padding:11px;font-size:14px;white-space:pre-wrap;line-height:1.7}
.dlist{font-size:13px;border-radius:var(--r);overflow:hidden;box-shadow:0 0 0 .5px var(--sep)}
.dlist tr{cursor:pointer}.dlist tr:hover td{background:var(--blue-bg)}
.dlist tr.grp td{background:var(--bg2);font-weight:600;padding-top:8px;padding-bottom:8px}
.dlist tr.grp:hover td{background:var(--bg2)}
.tpleg{margin-bottom:10px;line-height:2}
.tpleg span{display:inline-block;margin-right:14px;white-space:nowrap;font-size:12px;color:var(--t2)}
.tpleg i,.dlist .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.rcbox{background:rgba(255,149,0,.08);border:0;border-radius:var(--r-sm);padding:10px;font-family:var(--mono);
 font-size:11px;word-break:break-all;max-height:120px;overflow-y:auto;margin-top:8px;line-height:1.5}
.frow{border:0;border-radius:var(--r);padding:10px 12px;margin-bottom:8px;background:var(--card);
 display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 0 0 .5px var(--sep)}
.frow .sm{font-size:12px;color:var(--t2);flex:1;min-width:180px}
.frow .rq{font-size:12px;flex:1;min-width:180px}
.anchorbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:rgba(255,255,255,.8);
 -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:var(--r);padding:6px;box-shadow:var(--sh);position:sticky;top:60px;z-index:30}
.anchorbar button{background:transparent;border:0;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--t1)}
.anchorbar button:hover{background:var(--fill)}
.stickybar{position:sticky;top:60px;z-index:30;background:rgba(255,149,0,.1)}
.ph{display:inline-block;background:var(--blue-bg);border:0;color:#0a4a9e;border-radius:6px;padding:1px 8px;font-size:12px;font-family:var(--mono)}
.new{display:inline-block;background:var(--red);color:#fff;border-radius:9px;font-size:10px;font-weight:600;padding:1px 6px;margin-left:5px}
tr.got td{background:rgba(255,149,0,.06)}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(0,0,0,.3)}
::-webkit-scrollbar-track{background:transparent}

/* 窄屏 */
@media (max-width:820px){
 .wrap{flex-direction:column}
 nav{width:auto;height:auto;position:sticky;top:0;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:.5px solid var(--sep);z-index:40}
 nav::before{display:none}
 nav .nvb{width:auto;white-space:nowrap;margin:0}
 main{padding:18px 16px 40px}
 header{position:static}
 .grid2c{grid-template-columns:1fr}
 .r3{grid-template-columns:1fr}
}


/* ═════════ v2 布局 ═════════ */
main{max-width:1360px;margin:0 auto;padding:28px 36px 64px}
.phd{display:flex;align-items:flex-end;gap:16px;margin:2px 0 20px;flex-wrap:wrap}
.phd h2.pg{margin:0;font-size:30px;letter-spacing:-.03em}
.psub{color:var(--t2);font-size:13px;margin-top:4px}
.pact{margin-left:auto;display:flex;gap:8px}
.btn.sm{padding:6px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn.sm svg{width:14px;height:14px}
.btn.wide{width:100%;justify-content:center}

/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kgrid.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kt{background:var(--card);border-radius:18px;padding:16px 18px 16px;box-shadow:var(--sh);min-width:0;transition:transform .18s,box-shadow .18s}
.kt.click{cursor:pointer}
.kt.click:hover{transform:translateY(-2px);box-shadow:var(--sh-hover)}
.kt-top{display:flex;align-items:center;gap:9px}
.kt-ic{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.kt-ic svg{width:17px;height:17px}
.kt-l{font-size:13px;font-weight:600;color:var(--t2)}
.kt-go{margin-left:auto;color:var(--t3);font-size:18px;line-height:1}
.kt-v{font-size:36px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-top:12px;font-variant-numeric:tabular-nums}
.kt-v small{font-size:15px;font-weight:600;color:var(--t2);letter-spacing:0}
.kt-s{font-size:12px;color:var(--t2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt-s b{font-weight:600}

/* 卡片头 */
.card{border-radius:18px;padding:18px 20px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ch-ic{display:inline-flex}.ch-ic svg{width:18px;height:18px}
.ch-t{font-size:16px;font-weight:600;letter-spacing:-.015em}
.ch-x{margin-left:auto;font-size:12px;color:var(--t3);font-weight:500}
.cdesc{font-size:12.5px;color:var(--t2);margin:2px 0 12px}
.cfoot{font-size:12px;color:var(--t3);margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep)}
.cfoot b{color:var(--t2)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px;align-items:stretch}
.g2 > .card{display:flex;flex-direction:column}
.g2 > .card > .cfoot{margin-top:auto}
.g2 > .card{margin:0}
.g-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-bottom:16px;align-items:start}
.g-main > .card{margin:0}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 10px;color:var(--t3);font-size:13px}
.empty svg{width:34px;height:34px;opacity:.6}

/* 表格 v2 */
.tbl-wrap{overflow:auto;margin:0 -20px;padding:0 20px}
table.tbl{margin-top:0}
table.tbl th{position:sticky;top:0;background:var(--card);z-index:1}
table.tbl td{vertical-align:middle;padding:10px}
table.tbl tr{cursor:pointer}
table.tbl tr:hover td{background:#F5F8FF}
table.tbl.num td,table.tbl.num th{text-align:right;font-variant-numeric:tabular-nums}
table.tbl.num td:first-child,table.tbl.num th:first-child{text-align:left}
table.tbl.num td.clk{color:var(--blue);font-weight:500}
table.tbl.num td.z{color:#D1D1D6}
.c-date{color:var(--t2);font-size:12px;font-variant-numeric:tabular-nums;width:52px}
.c-main{min-width:240px}
.c-no{font-family:var(--mono);font-size:11.5px;color:var(--t2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.c-sum{font-size:13.5px;color:var(--t1);margin-top:2px;line-height:1.45}
.c-act{width:44px;text-align:center}
tr.r-unk td{background:rgba(255,59,48,.045)}
tr.r-unk td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr.r-ok .c-sum{color:var(--t2)}
.pill{display:inline-block;font-family:var(--font);font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;line-height:1.6}
.pill.red{background:rgba(255,59,48,.12);color:#d70015}
.pill.blue{background:rgba(0,122,255,.12);color:#0062cc}
.pill.green{background:rgba(52,199,89,.14);color:#248a3d}
.ckb{width:30px;height:30px;border-radius:50%;border:1.5px solid #D1D1D6;background:#fff;color:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:.15s}
.ckb svg{width:16px;height:16px}
.ckb:hover{border-color:var(--green);color:var(--green)}
.ckb.on{background:var(--green);border-color:var(--green);color:#fff}
td select{max-width:130px}
/* 承办人胶囊 */
.pcks{display:flex;flex-wrap:wrap;gap:4px;max-width:210px}
.pcks .ck{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--fill2);color:var(--t2);cursor:pointer;user-select:none;transition:.12s;line-height:1.6}
.pcks .ck:hover{background:var(--fill)}
.pcks .ck input{display:none}
.pcks .ck.on{background:var(--blue);color:#fff}

/* 右栏 */
.card.side{position:sticky;top:76px}
.prog{display:flex;align-items:center;gap:16px;margin:12px 0 14px}
.prog-l{flex:1;display:flex;flex-direction:column;gap:7px;font-size:13px}
.prog-l > div{display:flex;align-items:center;gap:7px}
.prog-l b{margin-left:auto;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.note{border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.note.warn{background:rgba(255,149,0,.1);color:#8a4b00}
.note.ok2{background:rgba(52,199,89,.1);color:#1c5c2c}
.note.info{background:var(--blue-bg);color:#0a4a9e}
.note-act{display:flex;gap:6px;margin-top:8px}
.side-ft{margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep);font-size:12px;color:var(--t2);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.side-ft .lnk{margin-left:auto}

/* 环形图 */
.dn{display:flex;align-items:center;gap:22px;margin-top:10px}
.dn-svg{width:170px;height:170px;flex-shrink:0}
.dn-leg{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dn-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 8px;border-radius:8px;cursor:pointer}
.dn-row:hover{background:var(--fill2)}
.dn-row i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dn-k{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-v{font-weight:600;font-variant-numeric:tabular-nums}
.dn-p{color:var(--t3);font-size:12px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--t2)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}

/* 筛选条 v2 */
.filters{position:sticky;top:62px;z-index:20;gap:12px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.85);
 -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:0}
.seg button{border:0;background:transparent;font-size:12.5px;font-weight:500;color:var(--t1);padding:5px 13px;border-radius:7px;transition:.12s}
.seg button:hover{background:rgba(255,255,255,.6)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.fgrp{display:inline-flex;align-items:center;gap:6px}
.rngnote{display:flex;align-items:center;gap:8px;background:transparent;color:var(--t2);padding:0 4px;margin:0 0 14px;font-size:12.5px}
.rngnote svg{width:15px;height:15px;flex-shrink:0;color:var(--t3)}

/* 周报 */
.wk-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:10px 12px}
.wk-bar label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2);font-weight:500}
.wk-bar select,.wk-bar input{background:#fff!important;box-shadow:0 0 0 .5px var(--sep2)}
.wk-no{display:inline-flex;align-items:center;gap:4px;color:var(--t1)}
.wk-no input{width:56px}
.wk-bar .sp{flex:1}
.paper-wrap{background:var(--bg);border-radius:12px;padding:24px;margin-top:12px;max-height:520px;overflow:auto}
.paper{background:#fff;max-width:640px;margin:0 auto;padding:44px 52px;box-shadow:0 2px 10px rgba(0,0,0,.08);border-radius:4px;font-size:14px;line-height:1.8;color:#000}

/* 子表 */
.sub-t{font-size:13px;font-weight:600;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.sub-t span{font-size:11px;background:var(--fill);color:var(--t2);border-radius:999px;padding:0 8px}
details.card > summary{font-size:15px;font-weight:600;color:var(--t1)}
details.card > summary::before{color:var(--t3)}

/* 侧栏底部 */
nav{display:flex;flex-direction:column}
.nav-ft{margin-top:auto;padding:12px 10px 4px;border-top:.5px solid var(--sep);font-size:12px}
.nav-ft-t{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:6px}
.nav-ft-r{display:flex;justify-content:space-between;color:var(--t2);padding:2px 0}
.nav-ft-r b{color:var(--t1);font-weight:500;font-variant-numeric:tabular-nums}
.nav-ft .lnk{margin:8px 0 0 -6px}

/* 顶栏菜单 */
.menu{position:relative}
.menu > summary{list-style:none;cursor:pointer;font-size:13px;font-weight:500;padding:6px 10px;border-radius:8px;color:var(--t1)}
.menu > summary::-webkit-details-marker{display:none}
.menu > summary::before{display:none}
.menu > summary::after{content:"⌄";margin-left:4px;color:var(--t3);position:relative;top:-2px}
.menu > summary:hover,.menu[open] > summary{background:var(--fill)}
.menu-p{position:absolute;right:0;top:calc(100% + 6px);min-width:190px;background:rgba(250,250,252,.92);
 -webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-radius:12px;padding:5px;
 box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.1);z-index:60}
.menu-p button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:13px;color:var(--t1)}
.menu-p button:hover{background:var(--blue);color:#fff}
.who-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.who-chip .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(160deg,#a0a0aa,#6e6e78);color:#fff;
 display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
#whoTag{display:none}
.hd-sep{width:.5px;height:20px;background:var(--sep2);margin:0 4px}

@media (max-width:1100px){
 .kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g-main{grid-template-columns:minmax(0,1fr)}
 .card.side{position:static}
}
@media (max-width:820px){
 .g2,.kgrid.k3{grid-template-columns:minmax(0,1fr)}
 .filters{position:static}
 .dn{flex-direction:column;align-items:stretch}
 .dn-svg{margin:0 auto}
 .nav-ft{display:none}
 nav{flex-direction:row}
}

@media (max-width:820px){
 main{width:100%;padding:18px 16px 40px}
 .phd h2.pg{font-size:26px}
 .kgrid{gap:10px}
 .kt{padding:14px}
 .kt-v{font-size:28px}
 .banner{font-size:11px}
 header{padding:10px 16px}
 .hd-right{margin-left:0;width:100%}
}
@media (max-width:520px){ .kgrid{grid-template-columns:1fr 1fr} .kt-s{white-space:normal} }
/* 问号说明 */
.hq{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:6px;
 border-radius:50%;background:var(--fill);color:var(--t2);font-size:11px;font-weight:700;line-height:1;cursor:help;
 vertical-align:middle;flex-shrink:0;outline:none;letter-spacing:0;font-family:var(--font);transition:background .12s,color .12s}
.hq:hover,.hq:focus{background:var(--blue);color:#fff}
h2.pg .hq{width:20px;height:20px;font-size:13px;margin-left:10px;position:relative;top:-3px}
.hpop{display:none;position:absolute;left:-10px;top:calc(100% + 8px);z-index:80;width:max-content;max-width:320px;
 background:rgba(255,255,255,.96);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
 color:var(--t1);font-size:12.5px;font-weight:400;line-height:1.65;text-align:left;letter-spacing:0;white-space:normal;
 padding:10px 13px;border-radius:12px;box-shadow:0 10px 32px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.08);cursor:default}
.hpop::before{content:"";position:absolute;left:14px;top:-5px;width:10px;height:10px;background:inherit;transform:rotate(45deg);
 box-shadow:-.5px -.5px 0 rgba(0,0,0,.06)}
.hq:hover .hpop,.hq:focus .hpop,.hq:focus-within .hpop{display:block}
.hq.r .hpop{left:auto;right:-10px}.hq.r .hpop::before{left:auto;right:14px}
.ch{position:relative}
.ch .ch-x + .hq{margin-left:6px}
.cfoot.red{color:var(--red)}
@media print{.hq{display:none!important}}
.kt,.card{position:relative}
.kt:has(.hq:hover),.kt:has(.hq:focus),.card:has(.hq:hover),.card:has(.hq:focus),.phd:has(.hq:hover),.phd:has(.hq:focus){z-index:40}

/* ═════════ v3 ═════════ */
.g-main{grid-template-columns:minmax(0,1fr) 320px}
.side-col{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
.side-col > .card{margin:0}
.cnt{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.cnt.warn{background:rgba(255,149,0,.12);color:#b25e00}
.cnt.ok{background:rgba(52,199,89,.12);color:#248a3d}
.bar-pend{display:flex;align-items:center;gap:8px;background:var(--blue-bg);color:#0a4a9e;border-radius:10px;padding:8px 10px 8px 14px;margin:10px 0 4px;font-size:13px}
.bar-pend .sp{flex:1}

/* 工单行 */
.olist{margin:10px -20px -18px;border-top:.5px solid var(--sep)}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-bottom:.5px solid var(--sep);position:relative}
.orow:last-child{border-bottom:0;border-radius:0 0 18px 18px}
.orow-m{display:flex;gap:14px;align-items:center;padding:13px 8px 13px 20px;cursor:pointer;min-width:0}
.orow:hover{background:#FAFAFC}
.orow.unk::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.o-date{width:40px;flex-shrink:0;text-align:center;line-height:1.15}
.o-date b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em}
.o-date span{font-size:11px;color:var(--t3)}
.o-body{min-width:0;flex:1}
.o-sum{font-size:14px;font-weight:500;line-height:1.45;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow.done .o-sum{color:var(--t2);font-weight:400}
.o-meta{display:flex;align-items:center;gap:14px;margin-top:4px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.o-meta .mono{font-size:11px;color:var(--t3)}
.o-g,.o-p{display:inline-flex;align-items:center;gap:4px}
.o-g svg,.o-p svg{width:12px;height:12px;color:var(--t3)}
.o-g.bad{color:var(--red);font-weight:600}.o-g.bad svg{color:var(--red)}
.o-act{display:flex;gap:8px;align-items:center;padding-right:18px}
.ib{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill2);color:var(--t2);display:inline-flex;align-items:center;justify-content:center;padding:0;transition:.12s}
.ib svg{width:15px;height:15px}
.ib:hover{background:var(--fill);color:var(--t1)}
.ib.on{background:var(--blue-bg);color:var(--blue)}
.o-edit{grid-column:1/-1;display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin:0 18px 14px 74px;padding:10px 14px;background:var(--bg);border-radius:12px}
.o-edit label{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t2)}
.o-edit select{background:#fff;box-shadow:0 0 0 .5px var(--sep2)}
.o-edit .pcks{max-width:none}
.o-edit .pcks .ck{background:#fff;box-shadow:0 0 0 .5px var(--sep2)}
.o-edit .pcks .ck.on{background:var(--blue);box-shadow:none}

/* 右栏表单 */
.form{display:flex;flex-direction:column;gap:0;margin-top:10px;background:var(--bg);border-radius:12px;padding:2px 12px}
.form label{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--sep);font-size:13px}
.form label:last-child{border-bottom:0}
.form label > span:first-child{width:34px;color:var(--t2);flex-shrink:0}
.form select,.form input{background:transparent!important;padding:3px 0!important;font-size:13px;border:0;outline:none;font-family:inherit;color:var(--t1);min-width:0}
.form select{flex:1}
.form .dr{display:flex;flex-direction:column;gap:2px;flex:1}
.form .wk-no input{width:50px;text-align:center;background:#fff!important;border-radius:6px;box-shadow:0 0 0 .5px var(--sep2)}
.wk-cnt{font-size:12.5px;color:var(--t2);margin:10px 2px}
.wk-cnt b{color:var(--t1)}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn2 .btn{justify-content:center}
.side-link{display:flex;align-items:center;gap:6px;width:100%;border:0;background:var(--card);border-radius:14px;padding:12px 16px;font-size:12.5px;color:var(--t2);box-shadow:var(--sh);text-align:left}
.side-link b{margin-left:auto;color:var(--t1)}
.side-link span{color:var(--t3);font-size:16px}
.side-link:hover{background:#FAFAFC}

/* pill 色 */
.pill.orange{background:rgba(255,149,0,.14);color:#b25e00}
.pill.gray{background:var(--fill);color:var(--t2)}
.pill.purple{background:rgba(175,82,222,.12);color:#8e3bb8}

/* ───── 工单详情 ───── */
.drawer{width:min(640px,94vw)}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--blue);font-size:13px;padding:2px 0;margin-bottom:10px}
.back svg{width:16px;height:16px}
.dv-hero{padding:4px 2px 14px}
.dv-tags{display:flex;gap:6px;flex-wrap:wrap}
.dv-tags .pill{font-size:11.5px;padding:2px 9px}
.dv-title{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.4;margin-top:10px}
.dv-no{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--t3)}
.dv-stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;box-shadow:0 0 0 .5px var(--sep);margin-bottom:14px}
.dv-stats > div{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dv-stats > div + div{border-left:.5px solid var(--sep)}
.dv-stats span{font-size:11.5px;color:var(--t2)}
.dv-stats b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.dv-stats em{display:block;font-style:normal;font-size:12px;font-weight:500;margin-top:2px}
.dv-grp{background:var(--card);border-radius:14px;box-shadow:0 0 0 .5px var(--sep);margin-bottom:14px;overflow:hidden}
.dv-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--t2);padding:11px 16px 9px;border-bottom:.5px solid var(--sep);background:#FBFBFD}
.dv-h .lnk,.dv-h .dv-by{margin-left:auto;font-weight:400}
.dv-by{font-size:12px;color:var(--t3)}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:10px 16px;font-size:13.5px;border-bottom:.5px solid var(--sep);align-items:baseline}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--t2)}
.kv .v{color:var(--t1);font-weight:500;word-break:break-all}
.kv .v .lnk{margin-left:6px}
.kv .v .mono{font-size:13px}
.dv-txt{padding:14px 16px;font-size:14px;line-height:1.75;white-space:pre-wrap}
.dv-txt.rep{background:rgba(52,199,89,.05)}
.dv-want{margin:0 16px 14px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:13.5px;line-height:1.65}
.dv-want span{display:block;font-size:11.5px;color:var(--t2);font-weight:600;margin-bottom:2px}
.dv-empty{padding:16px;color:var(--t3);font-size:13px}

/* ───── 明细清单 ───── */
.lgrp{background:var(--card);border-radius:14px;box-shadow:0 0 0 .5px var(--sep);overflow:hidden;margin-bottom:14px}
.lgrp-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:10px 16px;background:#FBFBFD;border-bottom:.5px solid var(--sep)}
.lgrp-h i{width:9px;height:9px;border-radius:3px}
.lgrp-h span{margin-left:auto;color:var(--t3);font-weight:500}
.lrow{display:flex;align-items:center;gap:14px;padding:11px 14px 11px 16px;border-bottom:.5px solid var(--sep);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#F5F8FF}
.l-date{font-size:12px;color:var(--t3);width:76px;flex-shrink:0;font-variant-numeric:tabular-nums}
.l-body{flex:1;min-width:0}
.l-sum{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--t2);margin-top:3px}
.l-meta .mono{font-size:11px;color:var(--t3)}
.l-st{display:flex;gap:4px;flex-shrink:0}
.l-go{color:#C7C7CC;font-size:18px}
.drawer .tpleg{margin-bottom:12px}

@media (max-width:1100px){.side-col{position:static}}
@media (max-width:600px){
 .o-edit{margin-left:18px}
 .o-date{display:none}
 .orow-m{padding-left:16px}
 .dv-stats{grid-template-columns:1fr}
 .dv-stats > div + div{border-left:0;border-top:.5px solid var(--sep)}

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function st(no,d){const v=LS.getItem('st_'+no);return v===null?d:v;}
function pp(no,d){const v=LS.getItem('pp_'+no);return v===null?d:v;}
function gg(no){const v=LS.getItem('gg_'+no);return v===null?null:v;}
function rp(no,d){const v=LS.getItem('rp_'+no);return v===null?d:v;}
function rt(no,d){const v=LS.getItem('rt_'+no);return v===null?d:v;}
function rb(no,d){const v=LS.getItem('by_'+no);return v===null?d:v;}
function ov(o){
  const x={no:o.no,status:st(o.no,o.status),person:pp(o.no,o.person),
    reply:rp(o.no,o.reply),replyTime:rt(o.no,o.replyTime),replyBy:rb(o.no,o.replyBy)};
  const g=gg(o.no);
  if(g!==null){x.grid=g;x.gridLabel=g;x.grids=[g];x.cross=false;}
  return x;}
function merge(o){const x=ov(o);return Object.assign({},o,x);}
function pd(s){if(!s)return null;const t=new Date(s.replace(' ','T'));return isNaN(t)?null:t;}
function dayDiff(dl){const t=pd(dl);if(!t)return null;const b=new Date(BASE+'T09:00:00');return (t-b)/86400000;}
function fmt(d){return d?d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';}
function shiftWork(dt){const d=new Date(dt);
  if(d.getHours()<9)d.setHours(9,0,0,0); else if(d.getHours()>=17){d.setDate(d.getDate()+1);d.setHours(9,0,0,0);}
  while(d.getDay()===0||d.getDay()===6){d.setDate(d.getDate()+1);d.setHours(9,0,0,0);} return d;}
function band(dl){const d=dayDiff(dl);
  if(d===null)return{t:'无期限',c:'#AEAEB2',p:9};
  if(d<0)return{t:'已超期 '+Math.abs(d).toFixed(1)+'天',c:'#FF3B30',p:0};
  if(d<=1)return{t:'最后DDL 剩'+d.toFixed(1)+'天',c:'#FF3B30',p:1};
  if(d<=1.5)return{t:'第2次提醒 剩'+d.toFixed(1)+'天',c:'#FF9500',p:2};
  if(d<=2)return{t:'第1次提醒 剩'+d.toFixed(1)+'天',c:'#FFB300',p:3};
  if(d<=7)return{t:'正常 剩'+d.toFixed(1)+'天',c:'#34C759',p:4};
  return{t:'宽裕 剩'+d.toFixed(1)+'天',c:'#8E8E93',p:9};}
function remindAt(dl,h){const t=pd(dl);if(!t)return null;return fmt(shiftWork(new Date(t.getTime()-h*3600000)));}
function active(o){return o.status==='处理中'||o.status==='待分派';}
function gList(o){return (o.grids&&o.grids.length)?o.grids:[o.grid];}
/* 统计口径：跨网格件单列为「跨网格协同」，避免同一单在两个网格各计一次 */
function mainG(o){return o.cross?'跨网格协同':(o.grid||'未识别');}
function pList(o){return (o.persons&&o.persons.length)?o.persons:(String(o.person||'').split('+').filter(Boolean));}
/* ---------- 统计口径（全站统一） ----------
   drill 演练工单：功能练习用，便携可视可操作，但不进任何统计
   退回件：非本辖区，按池内标记判定（不再依赖网格名猜）            */
function isD(o){return !!o.drill;}
function isBad(o){return o.status==='已退回'||o.status==='退回件'||o.back||o.grid==='退回件';}
function pool(){return ORDERS.map(merge).filter(o=>!isD(o)&&!isBad(o)&&o.status!=='演练');}
function scope(){const T=ORDERS.map(merge);
  const A=pool();let mem=0;A.forEach(o=>mem+=gList(o).length);
  return {tot:T.length,bak:T.filter(isBad).length,sam:T.filter(o=>o.status==='演练').length,
          dr:T.filter(isD).length,val:A.length,mem:mem,cross:A.filter(o=>o.cross).length,
          done:A.filter(o=>o.status==='已办结').length,act:A.filter(active).length};}
function scopeBar(){const s=scope();let t='原始导入 '+s.tot+' 条';
  if(s.bak)t+=' → 退回件 '+s.bak+' 条（非本辖区，全程剔除）';
  t+=' → <b>有效分析样本 '+s.val+' 条</b>；';
  if(s.cross)t+='；其中跨网格协同件 '+s.cross+' 件涉及两个网格，统计时单列为「跨网格协同」，'+
    '<b>不再重复计入</b>，因此全站网格合计 = '+s.val+' 件（若按网格展开则为 '+s.mem+' 件次）';
  return '<div class="card scope"><b>数据口径</b><div class="mini" style="margin-top:4px">'+t+'。</div>'+
    '<div class="mini" style="margin-top:4px">退回件（如有）全程剔除，不进入任何统计页。</div></div>';}

/* ---------- 时间区间筛选（月度分析 / 重复焦点共用）----------
   默认值恒为「全部」，两个分享同一份状态 F.m0 / F.m1，切换页面不用重选。 */
function monAdd(m,n){const y=+String(m).slice(0,4),k=+String(m).slice(5,7)-1+n,d=new Date(y,k,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function curKey(){return (F.m0||'最早')+' ~ '+(F.m1||'最新');}
function setRange(k){const b=BASE.slice(0,7),y=+b.slice(0,4),mo=+b.slice(5,7);
  if(k==='this'){F.m0=b;F.m1=b;}
  else if(k==='r3'){F.m0=monAdd(b,-2);F.m1=b;}
  else if(k==='q'){const s=Math.floor((mo-1)/3)*3+1;F.m0=y+'-'+String(s).padStart(2,'0');F.m1=monAdd(F.m0,2);}
  else if(k==='h1'){F.m0=y+'-01';F.m1=y+'-06';}
  else if(k==='h2'){F.m0=y+'-07';F.m1=y+'-12';}
  else if(k==='year'){F.m0=y+'-01';F.m1=y+'-12';}
  else {F.m0='';F.m1='';}
  render();}
function isFiltered(){return !!(F.m0||F.m1);}
/* 月份落在所选区间内（YYYY-MM 的字典序 == 时间序，直接比字符串即可） */
function inRange(m){return !!m&&(!F.m0||m>=F.m0)&&(!F.m1||m<=F.m1);}
function rngLabel(){return isFiltered()?((F.m0||'最早')+' ~ '+(F.m1||'最新')):'全部（截至目前的全部月份）';}
function rngCount(months){const n=months.filter(inRange).length;
  return isFiltered()?(F.m0||'最早')+' ~ '+(F.m1||'最新')+'　命中 '+n+' 个月（共 '+months.length+' 个月）':'全期 '+months.length+' 个月';}
function rngBar(months,grids,gkey){
  const ms=months.slice();
  if(F.m0&&ms.indexOf(F.m0)<0)ms.push(F.m0);
  if(F.m1&&ms.indexOf(F.m1)<0)ms.push(F.m1);
  ms.sort();
  const op=cur=>ms.map(m=>'<option value="'+m+'"'+(cur===m?' selected':'')+'>'+m+'</option>').join('');
  const QB=[['all','全部'],['this','本月'],['r3','近3个月'],['q','本季度'],['h1','上半年'],['h2','下半年'],['year','全年']];
  let s='<div class="filters"><b>时间</b>'+
    '<select id="fM0" onchange="F.m0=this.value;render()"><option value="">不限起点</option>'+op(F.m0)+'</select>'+
    '<span class="mini">至</span>'+
    '<select id="fM1" onchange="F.m1=this.value;render()"><option value="">不限终点</option>'+op(F.m1)+'</select>'+
    '<span class="qgrp">'+QB.map(q=>'<button class="lnk" onclick="setRange(\''+q[0]+'\')">'+q[1]+'</button>').join('')+'</span>';
  if(grids)s+='<b>网格</b><select id="fG" onchange="F.'+(gkey||'grid')+'=this.value;render()"><option value="">全部</option>'+
    grids.map(g=>'<option'+(F[gkey||'grid']===g?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select>';
  return s+'</div>';}
/* 区间在 months 数组上的下标范围，用于趋势图高亮 */
function rngBand(months){
  let i0=0,i1=months.length-1;
  if(F.m0){let k=-1;months.forEach((m,i)=>{if(k<0&&m>=F.m0)k=i;});i0=(k<0?months.length-1:k);}
  if(F.m1){let k=-1;months.forEach((m,i)=>{if(m<=F.m1)k=i;});i1=(k<0?0:k);}
  return [Math.min(i0,i1),Math.max(i0,i1)];}

var _DMS={},_DN=0;
/* 下钻一律「按键取值」而不是「按序号」：
   图表往往是排序 / 过滤后的子集，映射对象却是遍历顺序，
   一旦按下标取就会点A开B（如点油烟排放弹出其他消防安全）。  */
function jq(s){return JSON.stringify(String(s==null?'':s))
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dmReg(map,titles,mode,grp){const id='d'+(++_DN),m={},t={};
  if(Array.isArray(map)){map.forEach((v,i)=>{m[i]=v||[];});
    (titles||[]).forEach((s,i)=>{t[i]=s;});}
  else{const o=map||{};for(const k in o)m[k]=o[k]||[];
       if(titles&&!Array.isArray(titles))for(const k in titles)t[k]=titles[k];}
  _DMS[id]={m:m,t:t,mode:mode||'',grp:grp?1:0};
  return id;}
function dmGo(id,key){const e=_DMS[id];if(!e)return;const k=String(key);
  if(!Object.prototype.hasOwnProperty.call(e.m,k))return;
  drillNos(e.t[k]!==undefined?e.t[k]:k,e.m[k]||[],e.mode,e.grp);}
function dmOf(L,keyFn){const m={};L.forEach(o=>{const k=keyFn(o);if(k===null||k===undefined)return;
  (m[k]=m[k]||[]).push(o.no);});return m;}
function nosOf(L){return L.map(o=>o.no);}
/* 诉求人 / 电话（电话一律用文本+复制按钮，绝不做 tel: 链接，避免 file:// 弹出"需要新应用打开"） */
function whoHtml(o,big){
  const n=o.name||'',p=o.phone||'';
  if(!n&&!p)return '';
  let s=big?('<span>诉求人 <b>'+esc(n||'（匿名）')+'</b></span>')
           :('<span class="mini">诉求人 '+esc(n||'匿名')+'</span>');
  if(p&&p!=='保密')s+=big?('<span>电话 <b class="ph">'+esc(p)+'</b></span>')
                         :('<span class="mini"> · <b class="ph">'+esc(p)+'</b></span>');
  else if(p)s+=big?'<span>电话 <b>保密</b></span>':'<span class="mini"> · 保密</span>';
  if(p&&p!=='保密')s+='<button class="lnk" onclick="cpText(\''+esc(p)+'\')">复制号码</button>';
  return s;}
function jump(id){const e=document.getElementById(id);if(e)e.scrollIntoView({block:'start'});}
function ja(v){return JSON.stringify(v).replace(/"/g,'&quot;');}
function closeDr(){document.getElementById('drawer').classList.add('hide');
  document.getElementById('mask').classList.add('hide');}
function openDr(title,html){const d=document.getElementById('drawer'),m=document.getElementById('mask');
  d.innerHTML='<div class="dhd"><b>'+esc(title)+'</b><span class="sp">'+
    '<button class="btn gray" onclick="closeDr()">关闭</button></span></div>'+html;
  d.classList.remove('hide');m.classList.remove('hide');d.scrollTop=0;}
function stTag(s){const c=(s==='已办结'?'#28A745':s==='待分派'?'#FFB300':(s==='已退回'||s==='退回件')?'#AEAEB2':
  s==='演练'?'#AF52DE':s==='处理中'?'#007AFF':'#6E6E73');
  return '<span class="tag" style="background:'+c+'">'+esc(s||'-')+'</span>';}
function no2o(no){const f=ORDERS.filter(o=>o.no===no)[0];
  return f?merge(f):{no:no,status:'不在工单池',content:'',grid:'',person:'',deadline:''};}
/* 诉求摘要：优先用生成好的归纳摘要，没有则退回原文截断（旧数据 / 未重跑时） */
function sumOf(o,n){const s=String((o&&o.summary)||(o&&o.content)||'');
  return n&&s.length>n?cut(s,n):s;}
/* 事项主题固定色板：常见主题给固定色，保证同一主题在全站同色；其余回退灰 */
const TPC={'油烟/餐饮':'#dd6b20','环境卫生/杂物':'#38a169','停车/违停':'#2b6cb0','消防/消控室':'#e53e3e',
  '漏水/堵塞':'#319795','绿化/树木':'#276749','噪声扰民':'#805ad5','违建':'#975a16','充电/飞线':'#c05621',
  '电梯':'#2c5282','物业服务':'#4c51bf','道路设施':'#718096','群租':'#b7791f','安全隐患':'#9b2c2c',
  '门禁/监控':'#2b6cb0','路灯/照明':'#d69e2e','流浪动物':'#975a16','施工/装修':'#b7791f',
  '邻里纠纷':'#9b2c2c','退款/消费纠纷':'#044e9a'};
function tpColor(t){return TPC[t]||'#AEAEB2';}
function tpOf(no){const m=(DATA.semantic||{}).工单主题||{};return m[no]||'';}
/* mode==='done' 时，清单改显「办结时间 / 回复人 / 回复摘要」；诉求摘要所有模式都有
   grp=1 时按「事项主题」分段展示（高频投诉人专用：同一个人投诉好几类，混在一张平表里看不出来） */
function drillNos(title,nos,mode,grp){window._curList={t:title,n:nos,m:mode||'',g:grp?1:0};
  openDr(title+'　'+nos.length+' 件',detList(nos,mode,grp));}
function drillBack(){const c=window._curList;if(c&&c.n&&c.n.length)drillNos(c.t,c.n,c.m,c.g);else closeDr();}
function detList(nos,mode,grp){
  if(!nos||!nos.length)return '<div class="ok">没有工单。</div>';
  const M=(mode==='done'),D=(mode==='due'),LV=(mode==='live'),SN=(mode==='sent');
  const byT=function(a,b){const oa=no2o(a),ob=no2o(b);
    return String(rt(ob.no,ob.replyTime||'')||'').localeCompare(String(rt(oa.no,oa.replyTime||'')||''));};
  let L=nos;
  if(M||SN)L=nos.slice().sort(byT);
  if(D)L=nos.slice().sort(function(a,b){const oa=no2o(a),ob=no2o(b);
    return (oa.deadline||'').localeCompare(ob.deadline||'');});
  /* 表头与行按「同一个数组」拼装：过去 done 模式表头多写一列「摘要」而行里没输出，
     8 列表头配 7 格数据导致整行左移一格（回复摘要显示在摘要列下、末列空白）。现统一顺序，错位不再可能发生。 */
  /* 分派相关变量（can / PERS）已随功能移除 */
  const hd=['工单号','网格','承办','状态'];
  if(D)hd.push('计划完成','提醒时刻');
  if(M)hd.push('办结时间','回复人');
  if(SN)hd.push('办结时间');
  if(!D)hd.push('诉求摘要');
  if(M||SN)hd.push('回复摘要');
  /* 改派 / 操作列：分派功能已移除 */
  const hrow='<tr>'+hd.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
  /* 单行 = 表头顺序原样输出，分组与平表共用，杜绝再次错位 */
  const rowOf=function(n){const o=no2o(n),b=band(o.deadline);
    let mid='';
    if(D){const hrs=b.p===3?48:b.p===2?36:24;
      mid='<td class="mini">'+esc(o.deadline||'-')+'</td><td class="mini">'+
        (b.p<=2?'<b class="red">立即</b>':esc(remindAt(o.deadline,hrs)||'-'))+'</td>';}
    else{
      if(M||SN)mid='<td class="mini">'+esc(rt(o.no,o.replyTime||'-'))+'</td>'+
        (M?'<td>'+esc(rb(o.no,o.replyBy||'-'))+'</td>':'');
      mid+='<td class="mini" title="'+esc(o.content||'')+'">'+esc(sumOf(o,40))+'</td>';
      if(M||SN){const r=rp(o.no,o.reply||'');
        mid+='<td class="mini">'+(r?esc(cut(r,44)):'<span class="gry">（无回复内容）</span>')+'</td>';}
    }
    /* 改派 / 标记办结 操作单元格：分派功能已移除 */
    return '<tr onclick="detOne(\''+esc(o.no)+'\',1)"><td class="mono">'+esc(o.no)+
       (isD(o)?' <span class="tag drl">演练</span>':'')+'</td><td>'+
       esc(o.gridLabel||o.grid)+'</td><td>'+esc(o.person||'-')+'</td><td>'+stTag(o.status)+'</td>'+
       mid+'</tr>';};
  let tip='点任意一行看完整描述与处置回复。';
  if(D)tip='点行看完整描述与处置回复；「提醒时刻」已自动顺延到工作时间（9:00–17:00，周末顺延至下一工作日）。';
  else if(M)tip='点行看完整描述、诉求人电话与回复全文。';
  else if(LV)tip='点行看完整描述与处置回复。';
  else if(SN)tip='这批发给 A 的回执已标记「已交回」，如需重发可点「取消已交回」。';
  /* 分组模式：按事项主题分段 + 顶部图例，一眼看出「这人到底投诉了哪几类」 */
  if(grp){
    const buckets={},order=[];
    L.forEach(n=>{const t=tpOf(n)||'其他事项';
      if(!buckets[t]){buckets[t]=[];order.push(t);} buckets[t].push(n);});
    if(!Object.keys((DATA.semantic||{}).工单主题||{}).length)
      return '<div class="dsec"><div class="mini"><span class="red">当前数据缺少逐单主题信息，请重跑「一键更新」后再看分类。</span></div>'+
        '<table class="dlist">'+hrow+L.map(rowOf).join('')+'</table></div>';
    const legend='<div class="tpleg">涉及 <b>'+order.length+'</b> 类：'+
      order.map(t=>'<span><i style="background:'+tpColor(t)+'"></i>'+esc(t)+' '+buckets[t].length+' 件</span>').join('')+
      '</div>';
    let body='';
    order.forEach(t=>{body+='<tr class="grp"><td colspan="'+hd.length+'">'+
       '<i class="dot" style="background:'+tpColor(t)+'"></i>'+esc(t)+'　'+buckets[t].length+' 件</td></tr>'+
       buckets[t].map(rowOf).join('');});
    return '<div class="dsec">'+legend+'<table class="dlist">'+hrow+body+'</table>'+
      '<div class="mini" style="margin-top:6px">同一颜色 = 同一类问题。'+tip+'</div></div>';
  }
  return '<div class="dsec"><table class="dlist">'+hrow+L.map(rowOf).join('')+
    '</table><div class="mini" style="margin-top:6px">'+tip+'</div></div>';}
function detOne(no,fromList){
  if(!fromList)window._curList=null;
  const o=no2o(no),b=band(o.deadline);
  const r=rp(no,o.reply||''),tm=rt(no,o.replyTime||''),by=rb(no,o.replyBy||'');
  const can=(ROLE!=='领导')&&(ROLE==='A'||pList(o).indexOf(ROLE)>=0);
  let s='<div class="dsec"><div class="drow"><span>工单号 <b class="mono">'+esc(o.no)+'</b></span>'+
    '<span>状态 <b>'+stTag(o.status)+'</b></span><span>网格 <b>'+esc(o.gridLabel||o.grid)+'</b></span>'+
    '<span>承办 <b>'+esc(o.person||'-')+'</b></span>'+(o.line?'<span>条线 <b>'+esc(o.line)+'</b></span>':'')+
    (o.cross?'<span class="tag" style="background:#AF52DE">协同办理</span>':'')+'</div>'+
    '<div class="drow"><span>创建 <b>'+esc(o.create||'-')+'</b></span><span>期限 <b>'+esc(o.deadline||'-')+
    '</b></span><span>时限 <b style="color:'+b.c+'">'+b.t+'</b></span>'+
    (tm?'<span>办结 <b>'+esc(tm)+'</b></span>':'')+(by?'<span>回复人 <b>'+esc(by)+'</b></span>':'')+'</div>'+
    (o.basis?'<div class="drow"><span>判定依据 <b>'+esc(o.basis)+'</b></span></div>':'')+
    ((o.name||o.phone||o.addr)?'<div class="drow">'+whoHtml(o,1)+
      (o.addr?'<span>地址 <b>'+esc(o.addr)+'</b></span>':'')+'</div>':'')+'</div>';
  s+='<div class="dsec"><h4>工单描述</h4><div class="dtxt">'+esc(o.content||'（无）')+'</div>'+
     (o.want?'<div class="drow" style="margin-top:8px"><span>诉求要求 <b>'+esc(o.want)+'</b></span></div>':'')+
     (o.word?'<div class="bar"><a class="abtn" href="'+encodeURI(o.word)+'" target="_blank">打开原始 Word</a></div>':'')+'</div>';
  s+='<div class="dsec"><h4>处置回复</h4>';
  if(r)s+='<div class="drep">'+esc(r)+'</div>';
  else s+='<div class="mini">尚未填写回复。</div>';
  s+='</div><div class="bar">'+
     (window._curList?'<button class="btn gray" onclick="drillBack()">返回清单</button>':'')+
     '<button class="btn gray" onclick="closeDr()">关闭</button></div>';
  openDr('工单详情 · '+o.no,s);}

/* ---------- 文本复制（复制电话号码等，零依赖离线） ---------- */
function cpText(t,ok,ng){ok=ok||function(){};ng=ng||function(){};let f=0;
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;
    ta.style.position='absolute';ta.style.left='-9999px';ta.style.top='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    let r=false;try{r=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);r?ok():ng();};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(t).then(ok,function(){if(f++)return;fallback();});
      else fallback();}
  catch(e){if(f++)return;fallback();}}

/* ---------- SVG 图表（零依赖离线） ---------- */
function pal(i){const C=['#007AFF','#34C759','#FF9500','#AF52DE','#FFCC00','#30B0C7','#FF3B30',
  '#8E8E93','#5856D6','#A2845E','#FF2D55','#00C7BE','#32ADE6','#BF5AF2'];return C[i%C.length];}
function cut(s,n){s=String(s==null?'':s);return s.length>n?s.slice(0,n)+'…':s;}
function mLines(sv,W,H,L,R,T,mx){let s='';for(let g=0;g<=3;g++){const y=T+(H-T-24)*g/3;
  s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#ECECF0"/>'+
     '<text x="2" y="'+(y+4)+'" font-size="10" fill="#AEAEB2">'+Math.round(mx-mx*g/3)+'</text>';}
  return sv+s;}
/* 横向条形图 items=[{k,v,c,u}] */
function cBarH(items,opt){opt=opt||{};
  if(!items||!items.length)return '<div class="cbox mini">暂无数据</div>';
  const lw=opt.lw||130,rowH=25,W=opt.w||660,H=items.length*rowH+6,bw=W-lw-70;
  let mx=1;items.forEach(x=>{if(x.v>mx)mx=x.v;});
  const did=opt.dm?dmReg(opt.dm,opt.dmT,opt.dmMode,opt.dmGrp):'';
  const cl=k=>opt.dm?' data-d="1" onclick="dmGo('+jq(did)+','+jq(k)+')"':'';
  const tip=opt.dm?'（点击查看明细）':'';
  let s='<div class="cbox"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px">';
  items.forEach((x,i)=>{const y=i*rowH+3,w=Math.max(2,bw*x.v/mx),kk=(x.k===undefined?i:x.k);
    s+='<text x="0" y="'+(y+13)+'" font-size="12" fill="#6E6E73"'+cl(kk)+'><title>'+esc(x.k)+tip+'</title>'+
       esc(cut(x.k,Math.floor(lw/13)))+'</text>';
    s+='<rect x="'+lw+'" y="'+y+'" width="'+w+'" height="14" rx="3" fill="'+(x.c||pal(0))+'"'+cl(kk)+'><title>'+
       esc(x.k)+'：'+x.v+(x.u||'')+tip+'</title></rect>';
    s+='<text x="'+(lw+w+6)+'" y="'+(y+13)+'" font-size="12" fill="#1D1D1F"'+cl(kk)+'>'+x.v+(x.u||'')+'</text>';});
  return s+'</svg>'+(opt.dm?'<div class="mini">点柱子 / 名称 / 数字可展开该组工单明细。</div>':'')+'</div>';}
/* 环形图 items=[{k,v}] */
function cDonut(items,opt){opt=opt||{};
  if(!items||!items.length)return '<div class="cbox mini">暂无数据</div>';
  let tot=0;items.forEach(x=>tot+=x.v);tot=tot||1;
  const R=54,C=2*Math.PI*R;let off=0;
  const did=opt.dm?dmReg(opt.dm,opt.dmT):'';
  const cl=k=>opt.dm?' data-d="1" onclick="dmGo('+jq(did)+','+jq(k)+')"':'';
  const tip=opt.dm?'（点击查看明细）':'';
  let s='<div class="cbox"><svg viewBox="0 0 440 215" width="100%" style="max-width:440px">';
  s+='<g transform="translate(80,100) rotate(-90)">';
  items.forEach((x,i)=>{const len=C*x.v/tot;
    s+='<circle r="'+R+'" fill="none" stroke="'+pal(i)+'" stroke-width="28" stroke-dasharray="'+len+' '+(C-len)+
       '" stroke-dashoffset="'+(-off)+'"'+cl(x.k)+'><title>'+esc(x.k)+'：'+x.v+' 件（'+
       (x.v/tot*100).toFixed(1)+'%）'+tip+'</title></circle>';
    off+=len;});
  s+='</g><text x="80" y="98" text-anchor="middle" font-size="22" font-weight="bold" fill="#1D1D1F">'+tot+'</text>'+
     '<text x="80" y="116" text-anchor="middle" font-size="11" fill="#8E8E93">合计</text>';
  items.forEach((x,i)=>{const col=Math.floor(i/7),row=i%7,y=22+row*25,xp=195+col*145;
    s+='<rect x="'+xp+'" y="'+(y-9)+'" width="10" height="10" rx="2" fill="'+pal(i)+'"'+cl(x.k)+'/>'+
       '<text x="'+(xp+15)+'" y="'+y+'" font-size="11" fill="#6E6E73"'+cl(x.k)+'><title>'+esc(x.k)+tip+'</title>'+
       esc(cut(x.k,9))+' '+x.v+'</text>';});
  return s+'</svg>'+(opt.dm?'<div class="mini">点扇区 / 图例可展开该组工单明细。</div>':'')+'</div>';}
/* 折线图 labels + series[{name,data,c}] */
function cLine(labels,series,opt){opt=opt||{};
  if(!labels||!labels.length)return '<div class="cbox mini">暂无数据</div>';
  /* T 必须留足顶部余量：最高点的「数值」在点上方 8px、「环比」再往上 13px，
     若 T 太小（原 10）这两行文字会落到 viewBox 之外被裁掉。
     取 T=34；H 同步加大 24，保证绘图区 ih 不变、图形不被压扁。 */
  const W=opt.w||660,H=opt.h||214,L=36,R=12,T=34,B=26,iw=W-L-R,ih=H-T-B;
  let mx=1;series.forEach(se=>se.data.forEach(v=>{if(v>mx)mx=v;}));
  const px=i=>L+(labels.length<2?iw/2:iw*i/(labels.length-1));
  const py=v=>T+ih-v/mx*ih;
  const did=opt.dm?dmReg(opt.dm,opt.dmT||labels):'';
  const cl=k=>opt.dm?' data-d="1" onclick="dmGo('+jq(did)+','+jq(k)+')"':'';
  const tip=opt.dm?'（点击查看明细）':'';
  let s='<div class="cbox"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px">';
  /* opt.band=[i0,i1]：把所选时间区间的那段铺一层淡蓝底。
     趋势图必须永远画全期，不能用区间把其他月份切光（否则单月筛选会画出一条「断崖」，
     而环比基于全 0 序列更会完全失真）。区间只影响「构成类」图表，这里用底色区分即可。 */
  if(opt.band){const gap=labels.length>1?iw/(labels.length-1):Math.min(40,iw);
    const b0=px(Math.max(0,Math.min(opt.band[0],labels.length-1))),
          b1=px(Math.max(0,Math.min(opt.band[1],labels.length-1)));
    s+='<rect x="'+(b0-gap/2)+'" y="'+T+'" width="'+Math.max(20,(b1-b0)+gap)+
       '" height="'+ih+'" fill="#9CCBFF" opacity=".35" rx="4"/>';}
  s=mLines(s,W,H,L,R,T,mx);
  series.forEach((se,si)=>{const c=se.c||pal(si);
    s+='<polyline points="'+se.data.map((v,i)=>px(i)+','+py(v)).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="2"/>';
    se.data.forEach((v,i)=>{s+='<circle cx="'+px(i)+'" cy="'+py(v)+'" r="3.5" fill="#fff" stroke="'+c+
      '" stroke-width="2"'+cl(i)+'><title>'+esc(labels[i])+' '+esc(se.name)+'：'+v+tip+'</title></circle>'+
      '<text x="'+px(i)+'" y="'+(py(v)-8)+'" font-size="10" fill="#6E6E73" text-anchor="middle"'+cl(i)+'>'+v+'</text>'+
      ((opt.mom&&opt.mom[i]!==null&&opt.mom[i]!==undefined)?
        '<text x="'+px(i)+'" y="'+(py(v)-21)+'" font-size="9" text-anchor="middle" fill="'+
        (opt.mom[i]>0?'#FF3B30':'#34C759')+'">'+(opt.mom[i]>0?'↑':'↓')+
        Math.abs(opt.mom[i]).toFixed(0)+'%</text>':'');});});
  labels.forEach((l,i)=>{s+='<text x="'+px(i)+'" y="'+(H-8)+'" font-size="10" fill="#8E8E93" text-anchor="middle"'+
    cl(i)+'>'+esc(l)+'</text>';});
  return s+'</svg>'+(opt.mom?'<div class="mini">点上方的数字为月工单量，<span class="red">↑红</span>/'+
    '<span class="grn">↓绿</span>为环比涨跌幅（首月无环比）。</div>':'')+
    (opt.dm?'<div class="mini">点折线上的点 / 月份可展开该月工单明细。</div>':'')+'</div>';}
/* 堆叠柱状图：labels(月) × keys(网格) ，mat[key][i] */
function cStack(labels,keys,mat,opt){opt=opt||{};
  if(!labels||!labels.length)return '<div class="cbox mini">暂无数据</div>';
  /* T 留足顶部余量：柱顶的「总量」数字要放得下，否则最高柱的数字被裁（用户截图）。
     H 同步加大 24，保持绘图区 ih 不变。 */
  const W=680,H=274,L=36,R=12,T=34,B=54,iw=W-L-R,ih=H-T-B;
  const tot=labels.map((_,i)=>keys.reduce((a,k)=>a+(mat[k][i]||0),0));
  const mx=Math.max(1,...tot);
  const bw=Math.min(54,iw/labels.length*0.62);
  const did=opt.dm?dmReg(opt.dm,opt.dmT):'',mid=opt.dmM?dmReg(opt.dmM,labels):'';
  const cS=q=>opt.dm?' data-d="1" onclick="dmGo('+jq(did)+','+jq(q)+')"':'';
  const cM=i=>opt.dmM?' data-d="1" onclick="dmGo('+jq(mid)+','+jq(i)+')"':'';
  const tip=opt.dm?'（点击查看明细）':'';

/* 环比柱状：涨红跌绿 items=[{k,v,r}] */
function cMoM(items,opt){opt=opt||{};
  if(!items||!items.length)return '<div class="cbox mini">暂无数据</div>';
  /* 同 cLine/cStack：柱顶两级文字（数值 y-4、环比 y-16）需要顶部余量 */

  let mx=1;items.forEach(x=>{if(x.v>mx)mx=x.v;});

       '<text x="2" y="'+(y+4)+'" font-size="10" fill="#AEAEB2">'+Math.round(mx-mx*g/2)+'</text>';}
  items.forEach((x,i)=>{const cx=L+iw*(i+0.5)/items.length,hh=ih*x.v/mx,y=T+ih-hh;

    s+='<text x="'+cx+'" y="'+(y-4)+'" font-size="11" fill="#1D1D1F" text-anchor="middle"'+cl(x.k)+'>'+x.v+'</text>';
    s+='<text x="'+cx+'" y="'+(y-16)+'" font-size="10" text-anchor="middle" fill="'+c+'"'+cl(x.k)+'>'+
       (x.r===null?'—':(x.r>0?'↑':'↓')+Math.abs(x.r).toFixed(0)+'%')+'</text>';
    s+='<text x="'+cx+'" y="'+(H-7)+'" font-size="10" fill="#8E8E93" text-anchor="middle"'+cl(x.k)+'>'+esc(x.k.slice(5))+'月</text>';});

/* 时间轴：重复工单持续跨度 items=[{k,s,e,v}] */
function cTime(items,opt){opt=opt||{};
  if(!items||!items.length)return '<div class="cbox mini">暂无数据</div>';
  const W=680,L=190,R=30,rowH=26,H=items.length*rowH+26,iw=W-L-R;
  let mn=null,mx=null;
  items.forEach(x=>{const a=pd(x.s),b=pd(x.e);if(a&&(!mn||a<mn))mn=a;if(b&&(!mx||b>mx))mx=b;});
  if(!mn)return '<div class="cbox mini">暂无数据</div>';
  if(!mx||mx<=mn)mx=new Date(mn.getTime()+86400000);
  const span=(mx-mn)/86400000;
  const px=d=>L+iw*((d-mn)/86400000)/span;
  const did=opt.dm?dmReg(opt.dm,opt.dmT):'';
  const cl=k=>opt.dm?' data-d="1" onclick="dmGo('+jq(did)+','+jq(k)+')"':'';
  const tip=opt.dm?'（点击查看该组全部工单）':'';
  let s='<div class="cbox"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px">';
  let t0=String(mn).slice(0,10), t1=String(mx).slice(0,10);
  s+='<text x="'+L+'" y="12" font-size="10" fill="#AEAEB2">'+esc(t0)+'</text>';
  s+='<text x="'+(W-R)+'" y="12" font-size="10" fill="#AEAEB2" text-anchor="end">'+esc(t1)+'</text>';
  items.forEach((x,i)=>{const y=26+i*rowH,a=pd(x.s),b=pd(x.e);
    if(!a||!b)return;
    s+='<text x="0" y="'+(y+13)+'" font-size="11" fill="#6E6E73"'+cl(x.k)+'><title>'+esc(x.k)+tip+'</title>'+esc(cut(x.k,16))+'</text>';
    s+='<line x1="'+px(a)+'" y1="'+(y+8)+'" x2="'+px(b)+'" y2="'+(y+8)+'" stroke="'+pal(i)+'" stroke-width="5" stroke-linecap="round"'+
       cl(x.k)+'><title>'+esc(x.k)+'：'+x.v+' 条'+tip+'</title></line>';
    s+='<circle cx="'+px(a)+'" cy="'+(y+8)+'" r="4" fill="#fff" stroke="'+pal(i)+'" stroke-width="2"'+cl(x.k)+'><title>首次 '+esc(x.s)+tip+'</title></circle>';
    s+='<circle cx="'+px(b)+'" cy="'+(y+8)+'" r="4" fill="'+pal(i)+'"'+cl(x.k)+'><title>最近 '+esc(x.e)+'（'+x.v+' 条）'+tip+'</title></circle>';
    s+='<text x="'+(px(b)+8)+'" y="'+(y+12)+'" font-size="10" fill="#8E8E93"'+cl(x.k)+'>'+x.v+'条</text>';});
  return s+'</svg>'+(opt.dm?'<div class="mini">点名称 / 横条 / 两端圆点，展开该组全部工单。</div>':'')+'</div>';}

/* ---------- 新收工单分派核对 + 改派（持久化） ----------
   本周 = 周一至今；核对表 = 最近10 / 本周全展开（窗口内未识别置顶红标；不兜底历史未识别）。
   改派：下拉只暂存，点「确认改派」才写 localStorage 生效；导出 改派.json 放 _系统/ 后重跑一键更新固化。 */
function wkRange(){const t=new Date();let d=t.getDay();const mon=new Date(t);mon.setDate(t.getDate()-(d===0?6:d-1));
  const f=x=>x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2);
  return [f(mon), f(t)];}
function inWk(o){const w=wkRange();const d=(o.create||'').slice(0,10);return d>=w[0]&&d<=w[1];}
/* isReassigned 已移除：核对表只按「最近10 / 本周全展开」取数，不再兜底历史未识别 */
/* 核对表清单 = 最近10 条；本周(周一至今)新收 >10 则全展本周。
   只按窗口取数，不兜底历史未识别（过往数据不进核对，核对面向未来流程）。
   窗口内若有未识别，置顶 + 红标。 */
function checkOrders(){
  const A=ORDERS.map(merge).filter(o=>!isD(o)&&!isBad(o)&&o.src==='Word');
  const wk=A.filter(inWk);
  const list=wk.length>5?wk.slice()
    :A.slice().sort((a,b)=>String(b.create).localeCompare(String(a.create))).slice(0,5);
  list.sort((a,b)=>(b.grid==='未识别')-(a.grid==='未识别')
    ||String(b.create).localeCompare(String(a.create)));
  return list;}
/* 改派：先选后确认。下拉只改 PEND，点「确认改派」才写入 localStorage 生效。 */
var PEND={};
function gridSel(no,g){const G=['茂业豪园','沁园新村范巷','沁园新村邵巷','水仙里','自然村','经济条线','其他','未识别'];
  const cur=(PEND[no]&&PEND[no].grid!==undefined)?PEND[no].grid:g;
  return '<select onchange="pend(\''+esc(no)+'\',\'grid\',this.value)">'+G.map(x=>'<option'+(x===cur?' selected':'')+'>'+x+'</option>').join('')+'</select>';}
/* 网格 -> 默认承办人（与 assign.py 的 GRID_PERSON 一致） */
var GP={'水仙里':'蒋','沁园新村范巷':'邹','沁园新村邵巷':'汪','茂业豪园':'薛',
        '自然村':'厉','经济条线':'钱','其他':'许','未识别':'待定'};
/* 承办人允许多选（跨网格协同「邹+汪」等）：复选框切换，值以 + 连接 */
function personSel(no,p){const P=['蒋','邹','汪','薛','厉','钱','许','待定'];
  const cur=(PEND[no]&&PEND[no].person!==undefined)?PEND[no].person:p;
  const arr=String(cur).split('+').filter(Boolean);
  return '<span class="pcks">'+P.map(x=>'<label class="ck"><input type="checkbox" '+
    (arr.indexOf(x)>=0?'checked':'')+' onchange="event.stopPropagation();pendP(\''+esc(no)+'\',\''+x+
    '\',this.checked)">'+x+'</label>').join('')+'</span>';}
function pend(no,field,val){PEND[no]=PEND[no]||{};
  if(field==='grid'){PEND[no].grid=val;PEND[no].person=GP[val]||'待定';}
  else{PEND[no].person=val;}
  render();}
function pendP(no,name,on){PEND[no]=PEND[no]||{};
  let cur=String(PEND[no].person!==undefined?PEND[no].person:'').split('+').filter(Boolean);
  if(on){if(cur.indexOf(name)<0)cur.push(name);}else{cur=cur.filter(x=>x!==name);}
  PEND[no].person=cur.join('+');render();}
function pendCount(){return Object.keys(PEND).length;}
function confirmReassign(){try{for(const no in PEND){const p=PEND[no];

  const gsum=gitems.reduce((a,x)=>a+x.v,0);

     '<div class="card"><b>'+mth.slice(5)+'月工单 · 网格分布</b>'+cDonut(gi2,{dm:dmG2})+
     '<div class="mini" style="margin-top:6px">本月工单 <b>'+mm.length+'</b> 件（跨网格协同 '+x2.length+' 件）。'+
     '与左图对比，可看出各网格本月的占比变化。</div></div>'+
     '</div>';
  /* 11 数据留痕：仅留退回件一行小字（非本辖区，已剔除，备查） */
  const dgB=ORDERS.map(merge).filter(o=>!isD(o)&&(o.back||o.status==='已退回'));

/* ---------- ② 月度分析 ---------- */
function pgMonth(){
  const isP=['蒋','邹','汪','薛','厉','钱','许'].indexOf(ROLE)>=0;
  const A=pool();
  const S=isP?A.filter(o=>pList(o).indexOf(ROLE)>=0):A;
  const months=[...new Set(S.map(o=>o.month))].filter(Boolean).sort();
  const grids=[...new Set(S.map(o=>mainG(o)))].sort();
  let h='<h2 class="pg">月度分析'+(isP?'（我的数据）':'')+'</h2>';
  h+=rngBar(months,grids,'grid');
  h+='<div class="rngnote">当前区间：<b>'+rngCount(months)+'</b>'+
     '<span class="mini">　口径：月份按创建工单时间；退回件不计入；跨网格件单列为「跨网格协同」，不重复计入两个网格。</span></div>';
  /* 网格筛选对全页生效；时间筛选只作用于「构成类」数据（KPI / 网格×月度 / 类型 / 处理人）。
     趋势折线固定走全期：一旦用区间把它切了，其他月份会掉成 0，画出来是一条断崖，
     环比更是基于全 0 序列计算而彻底失真。全期曲线 + 区间底色才是正确表达。 */
  const Sg=S.filter(o=>!F.grid||mainG(o)===F.grid);
  const D=Sg.filter(o=>inRange(o.month));
  const ms=months.filter(inRange);
  const kpi=[['工单总量',D.length],
             ['涉及网格',[...new Set(D.map(o=>mainG(o)))].length],
             ['事项类型',[...new Set(D.map(o=>o.t3||'(未分类)'))].length]];
  h+='<div class="kpis">'+kpi.map(x=>'<div class="kpi"><div class="v">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>').join('')+'</div>';
  if(!D.length)return h+'<div class="ok">当前区间内没有数据。</div>';
  if(ms.length>1){
    const mat={},dmS={},dmM=[];
    grids.forEach(g=>{mat[g]=ms.map(m=>D.filter(o=>o.month===m&&mainG(o)===g).length);});
    ms.forEach(m=>{const la=m.slice(5)+'月';
      grids.forEach(g=>{dmS[g+' · '+la]=D.filter(o=>o.month===m&&mainG(o)===g).map(o=>o.no);});
      dmM.push(D.filter(o=>o.month===m).map(o=>o.no));});
    h+='<div class="card"><b>网格 × 月度 工单量（'+ms[0]+' ~ '+ms[ms.length-1]+'）</b>'+
       cStack(ms.map(m=>m.slice(5)+'月'),grids,mat,{dm:dmS,dmM:dmM})+
       '<details><summary>查看明细数字</summary><table><tr><th>网格</th>'+ms.map(m=>'<th>'+m.slice(5)+'月</th>').join('')+'<th>合计</th></tr>';
    grids.forEach(g=>{let tot=0;h+='<tr><td>'+esc(g)+'</td>';
      ms.forEach(m=>{const c=D.filter(o=>o.month===m&&mainG(o)===g).length;tot+=c;
        h+='<td style="cursor:pointer" onclick="drillNos(\''+esc(g+' · '+m.slice(5)+'月')+'\','+
           ja(dmS[g+' · '+m.slice(5)+'月']||[])+')">'+c+'</td>';});
      h+='<td><b>'+tot+'</b></td></tr>';});
    h+='</table></details></div>';
  }else{
    const gc={},dg={};D.forEach(o=>{const g=mainG(o);gc[g]=(gc[g]||0)+1;(dg[g]=dg[g]||[]).push(o.no);});
    const gi=Object.keys(gc).map(k=>({k:k,v:gc[k]})).sort((a,b)=>b.v-a.v);
    h+='<div class="card"><b>网格构成（'+ms[0]+' 单月）</b>'+
       cBarH(gi,{lw:150,w:620,u:' 件',dm:dg})+
       '<div class="mini" style="margin-top:6px">只选了一个月，跨月对比图不适用，这里改按网格看构成；'+
       '把起点或终点放宽到 ≥2 个月，会自动恢复「网格 × 月度」堆叠图。</div></div>';
  }
  const t3={},dT={};D.forEach(o=>{const k=o.t3||'(未分类)';t3[k]=(t3[k]||0)+1;(dT[k]=dT[k]||[]).push(o.no);});
  const tk=Object.keys(t3).sort((a,b)=>t3[b]-t3[a]).slice(0,12);
  h+='<div class="card"><b>类型构成（三级归口 TOP12）</b>'+
     cBarH(tk.map(k=>({k:k,v:t3[k]})),{lw:150,w:660,u:' 件',dm:dT})+'</div>';
  /* 按处理人统计：分派功能已移除 */
  const data=months.map(mo=>Sg.filter(o=>o.month===mo).length);
  const mom=months.map((m,i)=>{const p=i?data[i-1]:0;return i&&p?((data[i]-p)/p*100):null;});
  const dmTr=months.map(mo=>Sg.filter(o=>o.month===mo).map(o=>o.no));
  h+='<div class="card"><b>月度趋势（含环比涨跌幅）</b>'+
     cLine(months.map(x=>x.slice(5)+'月'),[{name:'工单量',data:data}],
       {dm:dmTr,dmT:months,mom:mom,band:rngBand(months)})+
     '<div class="mini" style="margin-top:6px">折线始终显示<b>全期 '+months.length+' 个月</b>'+
     (isFiltered()?'，<b>蓝底为当前所选区间</b>':'')+
     '：这样做是为了保留历史水位作对照，环比也始终按完整序列计算，不会因区间变窄而失真。</div></div>';
  return h;
}

/* ---------- ③ 重复与焦点分析 ---------- */
function pgFocus(){
  const S=DATA.semantic||{};
  const A=pool(),idx={};A.forEach(o=>{idx[o.no]=o;});
  const TM=S.工单主题||{};
  const months=[...new Set(A.map(o=>o.month))].filter(Boolean).sort();
  const fgrids=[...new Set(A.map(o=>o.grid))].filter(Boolean).sort();
  const keep=no=>{const o=idx[no];if(!o)return null;
    return (inRange(o.month)&&(!F.fgrid||o.grid===F.fgrid))?o:null;};
  /* 「切片重算」口径：把每组 / 每个人的成员裁到所选区间，再重新计数，
     区间内不足 2 条（共性焦点还要求不足 2 人）的自动退出榜单。
     若改成「整组保留」，一月份攒下、之后再无人反映的老组会永远挂在 TOP，
     时间越长越看不出近期态势 —— 这正是需要时间筛选要解决的问题。 */
  const phKey=o=>{const p=String((o&&o.phone)||'');if(!p||p==='保密')return '';return p.replace(/\D/g,'')||p;};
  const sliceDup=r=>{const ns=(r.工单||[]).map(keep).filter(Boolean);if(ns.length<2)return null;
    const ds=ns.map(o=>String(o.create||'').slice(0,10)).filter(Boolean).sort();
    return Object.assign({},r,{ns:ns.map(o=>o.no),条数:ns.length,
      投诉人数:new Set(ns.map(phKey).filter(Boolean)).size,
      首次:ds[0]||'',最近:ds[ds.length-1]||''});};
  const sliceHot=r=>{const ns=(r.工单||[]).map(keep).filter(Boolean);if(ns.length<2)return null;
    const ts=[...new Set(ns.map(o=>TM[o.no]||'其他事项'))].sort();
    return Object.assign({},r,{ns:ns.map(o=>o.no),件数:ns.length,涉及主题数:ts.length,主题:ts,
      类型:(ts.length>=3?'泛投诉型':'重复投诉型'),
      网格:[...new Set(ns.map(o=>o.grid).filter(Boolean))].sort()});};
  const dupAll=S.重复工单组||[],pplAll=S.高频投诉人||[];
  const focAll=dupAll.filter(r=>(r.投诉人数||0)>=2).length;
  const dup=dupAll.map(sliceDup).filter(Boolean).sort((a,b)=>b.条数-a.条数);
  const foc=dup.filter(r=>(r.投诉人数||0)>=2).sort((a,b)=>((b.投诉人数||0)-(a.投诉人数||0))||(b.条数-a.条数));
  const ppl=pplAll.map(sliceHot).filter(Boolean).sort((a,b)=>b.件数-a.件数);
  const hasF=isFiltered()||!!F.fgrid;
  let h='<h2 class="pg">重复与焦点分析</h2><div class="tip">'+
    '①一个人投诉多个问题 = 高频投诉人；②一个人反复投诉同一件事 = 重复工单；③多人投诉同一件事 = 共性焦点问题（治理价值最高）。'+
    '保密件不参与身份识别，仅参与焦点统计。</div>';
  h+=rngBar(months,fgrids,'fgrid');
  h+='<div class="rngnote">当前区间：<b>'+rngCount(months)+'</b>　重复工单 <b>'+dup.length+'</b> 组 / 全期 '+dupAll.length+
     '　·　高频投诉人 <b>'+ppl.length+'</b> 人 / 全期 '+pplAll.length+
     '　·　共性焦点 <b>'+foc.length+'</b> 组 / 全期 '+focAll+
     '<span class="mini">　口径：按区间把每组 / 每个人的成员裁剪后重新计数，区间内不足 2 条（共性焦点还要求 ≥2 人）即退出榜单，'+
     '所以历史上反复、近期已平息的事项不会继续占据 TOP 位。</span></div>';
  const tbl=(title,rows,cols,nos,grp)=>{
    let s='<div class="card"><b>'+title+'　'+rows.length+' 组</b>';
    if(!rows.length)return s+'<div class="mini">无</div></div>';
    s+='<table><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>';
    rows.slice(0,40).forEach(r=>{const ns=nos?(r.ns||[]):null;
      s+='<tr'+(ns&&ns.length?' style="cursor:pointer" onclick="drillNos(\''+esc(title)+' · '+
         esc(cols[1][1](r))+'\','+ja(ns)+','+(grp?'\'\',1':'\'\',0')+')"':'')+'>'+
         cols.map(c=>'<td class="mini">'+esc(c[1](r))+'</td>').join('')+'</tr>';});
    return s+'</table><div class="mini" style="margin-top:6px">点行可展开该组在当前区间内的工单。</div></div>';};
  if(!dup.length&&!ppl.length)
    h+='<div class="ok">当前区间内没有形成重复组（任一网格+事项不足 2 条，或没有人反映 2 件以上）。'+
       '把时间放宽到「全部」即可看历史累积。</div>';
  if(foc.length){
    const dmF={};foc.forEach(r=>{dmF[(r.网格||'')+' · '+r.主题]=r.ns||[];});
    h+='<div class="card"><b>🔥 共性焦点问题 TOP12（条数，标注投诉人数）</b>'+
       cBarH(foc.slice(0,12).map(r=>({k:(r.网格||'')+' · '+r.主题,v:r.条数,u:' 条 / '+r.投诉人数+' 人'})),
             {lw:230,w:700,dm:dmF})+
       '<div class="mini" style="margin-top:6px">多人投诉同一事项 = 设施或管理短板，建议专项整治而非逐单答复。</div></div>';
  }
  if(dup.length){
    const dmD={};dup.forEach(r=>{dmD[(r.网格||'')+' · '+r.主题]=r.ns||[];});
    h+='<div class="card"><b>🔁 重复工单持续跨度 TOP12</b>'+
       cTime(dup.slice(0,12).map(r=>({k:(r.网格||'')+' · '+r.主题,s:r.首次,e:r.最近,v:r.条数})),{dm:dmD})+
       '<div class="mini" style="margin-top:6px">横条越长＝投诉延续时间越久；若同一问题反复出现，说明未根除。'+
       '<b>点名称 / 横条可展开该组工单</b>（同一人反复投诉同一件事，逐条答复往往治标不治本）。'+
       (hasF?'<br>时间轴的两端已按所选区间重算，所以看到的就是这段时间内的持续跨度。':'')+'</div></div>';
  }
  if(ppl.length){
    /* 抽屉按「唯一键」取值：同名同主题数的人加后缀区分，避免互相覆盖 */
    const dmP={},pkey=[];
    ppl.forEach((r,i)=>{let k=(r.姓名||r.电话||'匿名')+'（'+(r.涉及主题数||0)+'类）';
      if(dmP[k]!==undefined)k=k+'·'+(i+1);
      dmP[k]=r.ns||[];pkey.push(k);});
    const noRep=ppl.filter(r=>!(r.ns||[]).length).length;
    h+='<div class="card"><b>👤 高频投诉人 TOP12（件数）</b>'+
       cBarH(ppl.map((r,i)=>({k:pkey[i],v:r.件数,u:' 件'})).slice(0,12),{lw:170,w:600,dm:dmP,dmGrp:1})+
       '<div class="mini" style="margin-top:6px">点柱展开该人的全部工单，<b>按事项主题分段并用颜色区分</b>；'+
       '「N 类」指其投诉覆盖了 N 个事项主题。'+
       (noRep?'<span class="red">需先重跑「一键更新」才能带上工单号（当前 '+noRep+' 人缺明细）。</span>':'')+'</div></div>';
  }
  /* 三张明细表与上方 TOP12 图表同源，收进一个折叠块：默认不占屏，需要查 12 名以后的组时再展开 */
  h+='<details class="card"><summary style="cursor:pointer"><b>展开全部明细表</b>'+
     '　重复工单 '+dup.length+' 组 · 高频投诉人 '+ppl.length+' 人 · 共性焦点 '+foc.length+' 组</summary>'+
     '<div class="mini" style="margin:6px 0">前三张图只显示 TOP12；这里可查到全部组，点行展开该组工单。</div>';
  const dB=(hasF?[]:[['楼栋/点位',r=>(r.楼栋||[]).join('、')]]);
  h+=tbl('🔁 重复工单明细',dup,
    [['网格',r=>r.网格],['事项',r=>r.主题]].concat(dB).concat(
    [['条数',r=>r.条数+' 条'],['人数',r=>r.投诉人数+' 人'],['首次',r=>r.首次],['最近',r=>r.最近],
     ['相似度',r=>(r.相似度||0).toFixed(2)+(hasF?'（全期）':'')]]),1);
  h+=tbl('👤 高频投诉人明细',ppl,
    [['称呼',r=>r.姓名||r.电话||'匿名'],['件数',r=>r.件数+' 件'],['涉及主题',r=>r.涉及主题数+' 类'],
     ['主题',r=>(r.主题||[]).slice(0,5).join('、')],['网格',r=>(r.网格||[]).join('、')]],1,1);
  h+=tbl('🔥 共性焦点明细',foc,
    [['网格',r=>r.网格],['事项',r=>r.主题]].concat(dB).concat(
    [['条数',r=>r.条数+' 条'],['投诉人数',r=>r.投诉人数+' 人'],['首次',r=>r.首次],['最近',r=>r.最近]]),1);
  h+='</details>';
  if(hasF)h+='<div class="mini" style="margin:-8px 0 12px">已按区间裁剪，明细表隐藏了「楼栋/点位」列（楼栋号取自工单原文，'+
     '无法按区间重算），「相似度」仍为全期值并已标注。若要看完整的楼栋点位，把时间切回「全部」。</div>';
  return h;
